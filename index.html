/* ===== mẫu (template) =====
   Khác với "lưu dự án": dự án nằm trong trình duyệt này và gắn với đúng bộ file đang mở.
   Mẫu là một file .json nhỏ chỉ chứa CÁCH LÀM — khung kịch bản, tên bác sĩ/bệnh viện, nhịp,
   màu chữ, nhạc, thẻ cuối — gửi cho người khác, họ thả ảnh của họ vào là ra clip cùng kiểu. */
const TPL_KEYS=["tpl","beats","bs","bv","pk","be","emoji","total","hold","xf","fit","look",
  "dedup","subs","subMax","subColor","music","fx","card","cardT","cardS","cardN","cardC"];
function buildTemplate(){
  const o={aes_mau:1,ten:P.name||"mau",ngay:new Date().toISOString().slice(0,10)};
  TPL_KEYS.forEach(k=>{ o[k]=AUTO[k] });
  return JSON.stringify(o,null,2);
}
async function saveTemplate(){
  await saveFile(safeName(P.name||"mau")+"_mau.json",buildTemplate(),"application/json");
}
function loadTemplateFile(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
  i.onchange=async()=>{
    const f=i.files&&i.files[0]; if(!f)return;
    try{
      const o=JSON.parse(await f.text());
      if(!o||!o.aes_mau)throw 0;
      TPL_KEYS.forEach(k=>{ if(o[k]!==undefined)AUTO[k]=o[k] });
      /* mẫu từ máy khác có thể trỏ tới file nhạc họ tự thả vào — máy này không có, quay về bài sẵn có */
      if(String(AUTO.music||"").startsWith("asset:"))AUTO.music=LIB_MUSIC[0].id;
      AUTO.approved=false;
      toast("Đã nạp mẫu “"+(o.ten||"mau")+"” — sang bước 2 đọc lại kịch bản rồi duyệt");
      step(2);
    }catch(e){ toast("File này không phải mẫu của app") }
  };
  i.click();
}
function saveProject(){
  try{ localStorage.setItem("aes-proj",JSON.stringify({P,AUTO:{script:AUTO.script,topic:AUTO.topic,tags:AUTO.tags,
    tpl:AUTO.tpl,beats:AUTO.beats,approved:AUTO.approved,total:AUTO.total,xf:AUTO.xf,fit:AUTO.fit,
    look:AUTO.look,dedup:AUTO.dedup,emoji:AUTO.emoji,music:AUTO.music,
    bs:AUTO.bs,bv:AUTO.bv,pk:AUTO.pk,be:AUTO.be,
    cardT:AUTO.cardT,cardS:AUTO.cardS,cardN:AUTO.cardN,cardC:AUTO.cardC},at:Date.now()}));
    toast("Đã lưu dự án") }catch(e){ toast("Trình duyệt không cho lưu") }
}
function loadProject(){
  let raw=null; try{ raw=localStorage.getItem("aes-proj") }catch(e){}
  if(!raw){ toast("Chưa có dự án nào được lưu"); return }
  try{ const o=JSON.parse(raw);
    if(!o||!o.P)throw 0;
    snapshot(); P=o.P;
    if(o.AUTO)Object.assign(AUTO,o.AUTO);
    $("#projName").value=P.name||"du_an";
    sel=null; seek(0); allUI();
    toast("Đã mở lại dự án — nhớ thả lại file video/voice");
  }catch(e){ toast("File lưu bị hỏng") }
}
$("#left").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b)return; const d=b.dataset;
  if(d.scan){
    const src=srcId&&assets.get(srcId); if(!src||busy)return;
    busy="Đang xem video nguồn…"; ui_left();
    try{ await analyzeSource(src,p=>{ const t=$("#busyTxt"); if(t)t.textContent="Đang xem video nguồn… "+Math.round(p*100)+"%" });
      toast(src.scenes?"Tách được "+src.scenes.length+" cảnh":"Video chưa tải xong, thử lại sau vài giây") }
    catch(err){ toast("Không đọc được video này") }
    finally{ busy=""; ui_left() }
    return;
  }
  if(d.mic){ await micToggle(); return }
  if(d.dedup){ const r=dedupe(); toast(r.total+" ảnh → giữ "+r.kept+" ảnh khác nhau"); ui_left(); return }
  if(d.copy){ await copyScript(); return }
  if(d.dai){ AUTO.total=+d.dai; ui_left(); return }
  if(d.moc){
    const m=mocGoi[+d.moc]; if(!m)return;
    const id=tplNow().beats[0].id;
    if(!AUTO.beats)AUTO.beats={};
    AUTO.beats[id]=[m[1]];
    AUTO.script=allLines().join("\n");
    AUTO.approved=false;
    mocGoi=[];
    toast("Đã đổi câu móc — đọc lại cả bài rồi bấm Duyệt");
    ui_left();
    return;
  }
  if(d.open){ window.open(d.open,"_blank","noopener"); return }
  if(d.tvl){ const k=$("#aKey"); if(k)ttsSetKey(k.value.trim()); await ttsLoadVoices(); return }
  if(d.tts){ const k=$("#aKey"); if(k)ttsSetKey(k.value.trim()); await ttsRun(); return }
  if(d.approve){ const t=$("#aTopic"); if(t)AUTO.topic=t.value; await build(); return }
  if(d.rewrite){
    if(busy)return;
    const t=$("#aTopic"); if(t)AUTO.topic=t.value;
    busy="Claude đang viết lại…"; ui_left();
    try{ aiCtl=new AbortController(); const r=await aiWrite(aiCtl.signal);
      toast(applyAI(r)?"Xong — đọc lại rồi bấm Duyệt":"Claude không trả về câu nào") }
    catch(err){ toast(aiMsg(err)) }
    finally{ busy=""; aiCtl=null; ui_left() }
    return;
  }
  if(d.dl){
    const nm=safeName(P.name);
    if(d.dl==="srt"){ if(!subRows().length){toast("Chưa có phụ đề nào");return} await saveFile(nm+".srt",buildSrt(),"text/plain;charset=utf-8") }
    else if(d.dl==="shots")await saveFile(nm+"_danh_sach_canh.txt",buildShotList(),"text/plain;charset=utf-8");
    else if(d.dl==="json")await saveFile(nm+".json",buildProjectJson(),"application/json");
    return;
  }
  if(d.prj){ d.prj==="save"?saveProject():loadProject(); return }
  if(d.tplf){ d.tplf==="save"?saveTemplate():loadTemplateFile(); return }
  if(d.add)addVisual(d.add);
  else if(d.role){ setAudioRole(d.role.split(":")[1],d.role.split(":")[0]); return }
  else if(d.voice)addAudio(d.voice,"voice");
  else if(d.music)addAudio(d.music,"music");
  else if(d.prev)preview(d.prev);
  else if(d.lib)addLib(LIB_MUSIC.find(x=>x.id===d.lib),false);
  else if(d.libfx)addLib(LIB_FX.find(x=>x.id===d.libfx),true);
  else if(d.go)seek(+d.go);
  else if(d.up||d.down){
    const arr=P.clips.video, i=arr.findIndex(c=>c.id===(d.up||d.down)), j=d.up?i-1:i+1;
    if(i<0||j<0||j>=arr.length)return; snapshot();
    const a=arr[i],b2=arr[j],as=a.start,bs=b2.start;
    a.start=d.up?bs:as+b2.dur; b2.start=d.up?bs+a.dur:as;
    arr.sort((x,y)=>x.start-y.start); allUI();
  }
});

    const rng=(k,v,a,b,s)=>'<input type="range" data-k="'+k+'" data-num="1" min="'+a+'" max="'+b+'" step="'+(s||1)+'" value="'+v+'">';
    insp='<div class="ttl">Đoạn đang chọn — '+LABEL[sel.k]+'</div><div class="card">'+
      f("Bắt đầu / Dài",'<div class="seg"><input type="number" data-k="start" data-num="1" step="0.1" value="'+c.start.toFixed(2)+'"><input type="number" data-k="dur" data-num="1" step="0.1" min="0.2" value="'+c.dur.toFixed(2)+'"></div>');
    if(sel.k==="text"){
      insp+=f("Kiểu",'<select data-k="style"><option value="pop"'+(c.style==="pop"?" selected":"")+'>Chữ nổi</option><option value="card"'+(c.style==="card"?" selected":"")+'>Thẻ cuối</option></select>')+
        f("Nội dung",txt("text",c.text));
      if(c.style==="card") insp+=f("Dòng phụ",txt("sub",c.sub))+f("Dòng nhỏ",txt("note",c.note))+f("Nút kêu gọi",txt("cta",c.cta));
      else insp+=f("Cỡ chữ <b>"+(c.size||92)+"</b>",rng("size",c.size||92,40,170))+
        f("Vị trí dọc <b>"+(c.pos==null?30:c.pos)+"%</b>",rng("pos",c.pos==null?30:c.pos,5,95))+
        f("Màu chữ",'<input type="color" data-k="color" value="'+(c.color||"#ffffff")+'">');
    } else if(sel.k==="video"){
      insp+=f("Hiệu ứng",'<select data-k="effect">'+Object.entries(EFFECTS).map(([k,v])=>'<option value="'+k+'"'+(c.effect===k?" selected":"")+'>'+v+'</option>').join("")+'</select>')+
        f("Tốc độ <b>"+(c.speed||1)+"x</b>",rng("speed",c.speed||1,.5,2,.1))+
        f("Cắt từ giây <b>"+(c.in||0).toFixed(1)+"</b>",rng("in",c.in||0,0,Math.max(1,((c.assetId&&assets.get(c.assetId)||{}).d||10)),.1))+
        f("Âm gốc clip <b>"+Math.round((c.vol==null?0:c.vol)*100)+"%</b>",rng("vol",c.vol==null?0:c.vol,0,1,.05));
    } else if(sel.k==="sub"){ insp+=f("Nội dung",txt("text",c.text)) }
    else if(sel.k==="fx"){ insp+=f("Âm lượng <b>"+Math.round((c.vol||0)*100)+"%</b>",rng("vol",c.vol||0,0,1,.05)) }
    else { insp+=f("Âm lượng <b>"+Math.round((c.vol==null?1:c.vol)*100)+"%</b>",rng("vol",c.vol==null?1:c.vol,0,1,.05)) }
    insp+='<button class="mini" data-dup="1">Nhân đôi</button></div>';
  }
  el.innerHTML='<div class="ttl">Dự án</div><div class="card">'+
    '<div class="hint" id="projInfo">'+metaHTML()+'</div></div>'+
    '<button class="btn" id="btnAddText" style="justify-content:center">T Thêm lớp chữ</button>'+
    '<div class="card"><div class="hint">⌨ <kbd>Space</kbd> phát/dừng · <kbd>S</kbd> cắt · <kbd>Delete</kbd> xóa · <kbd>Ctrl+Z</kbd> hoàn tác · <kbd>←</kbd>/<kbd>→</kbd> nhích đầu phát</div></div>'+
    insp+
    '<div class="ttl">Kiểu phụ đề (cho cả video)</div>'+
    '<div class="fld"><span>Hiển thị phụ đề</span><div class="seg"><button data-sub="on" aria-pressed="'+P.sub.on+'">Bật</button><button data-sub="off" aria-pressed="'+!P.sub.on+'">Tắt</button></div></div>'+
    '<label class="fld"><span>Cỡ chữ <b>'+P.sub.size+'</b></span><input type="range" data-s="size" min="40" max="150" value="'+P.sub.size+'"></label>'+
    '<label class="fld"><span>Vị trí (trên ↔ dưới) <b>'+P.sub.pos+'%</b></span><input type="range" data-s="pos" min="5" max="95" value="'+P.sub.pos+'"></label>'+
    '<label class="fld"><span>Màu chữ</span><input type="color" data-s="color" value="'+P.sub.color+'"></label>';
  $("#btnAddText").onclick=addTextLayer;
}
function readVal(t){ if(t.type==="checkbox")return t.checked; if(t.type==="number"||t.dataset.num||t.type==="range")return +t.value; return t.value }
function metaHTML(){ return 'Thời lượng: <b style="color:var(--fg)">'+fmt(dur())+'</b> · '+P.clips.video.length+' cảnh · '+
  P.clips.sub.length+' dòng phụ đề<br>Bấm vào một đoạn trên timeline để chỉnh riêng nó.' }
$("#right").addEventListener("input",e=>{
  const t=e.target, k=t.dataset.k||t.dataset.s; if(!k)return;
  if(!t._touched){ t._touched=true; snapshot() }
  const lab=t.closest(".fld")&&t.closest(".fld").querySelector("span b");
  if(t.dataset.k){
    const c=selClip(); if(!c)return; c[k]=readVal(t);
    if(lab)lab.textContent=k==="vol"?Math.round(c[k]*100)+"%":k==="speed"?c[k]+"x":k==="pos"?c[k]+"%":k==="in"?(+c[k]).toFixed(1):c[k];
    ui_timeline(); ui_info();
  } else {
    P.sub[k]=readVal(t); if(lab)lab.textContent=k==="pos"?P.sub.pos+"%":P.sub.size;
  }
  draw(time);
});
$("#right").addEventListener("change",e=>{
  const t=e.target; if(!(t.dataset.k||t.dataset.s))return; t._touched=false;
  if(t.dataset.k==="style"||t.dataset.k==="effect")ui_right();
});
$("#right").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.sub){ snapshot(); P.sub.on=b.dataset.sub==="on"; draw(time); ui_right() }
  if(b.dataset.dup){ const c=selClip(); if(!c)return; snapshot();
    const n=JSON.parse(JSON.stringify(c)); n.id=uid(); n.start=c.start+c.dur; P.clips[sel.k].push(n); sel={k:sel.k,id:n.id}; allUI() }
});
function addTextLayer(){ snapshot();
  const n={id:uid(),style:"pop",text:"Chữ mới",start:+time.toFixed(2),dur:2.5,size:92,pos:30,color:"#ffffff"};
  P.clips.text.push(n); sel={k:"text",id:n.id}; allUI();
}

/* ============================ timeline ============================ */
function snap(v){ const q=Math.round(v*20)/20; return Math.abs(q-time)*pps<9?time:q }
function clipLabel(k,c){
  if(k==="video"){const a=c.assetId&&assets.get(c.assetId);
    return c.dur.toFixed(1)+"s"+((c.speed||1)!==1?" · "+c.speed+"x":"")+(c.effect&&c.effect!=="none"?" · "+EFFECTS[c.effect]:"")+(a?"":" · thẻ")}
  if(k==="text")return (c.style==="card"?"▣ ":"T ")+(c.text||"");
  if(k==="sub")return c.text||"";
  if(k==="fx")return "✦ "+(c.label||"");
  const a=c.assetId&&assets.get(c.assetId);
  return (k==="music"?"♪ ":"🎙 ")+(c.label||(a?a.name:"âm thanh"));
}
function ui_timeline(){
  const total=Math.max(dur()+3,8), wpx=total*pps;
  const names=$("#names"); names.innerHTML='<div class="sp"></div><div id="nmwrap">'+TRACKS.map(k=>'<div class="nmrow">'+LABEL[k]+'</div>').join("")+'</div>';
  $("#nmwrap").style.transform="translateY("+(-$("#scroller").scrollTop)+"px)";
  const ruler=$("#ruler"); let h="";
  const stepS=pps<30?10:pps<60?5:pps<110?2:1;
  for(let s=0;s<=total;s+=stepS){ const maj=s%(stepS*5)===0;
    h+='<div class="tk'+(maj?" maj":"")+'" style="left:'+(s*pps)+'px"></div>'+(maj?'<span style="left:'+(s*pps+5)+'px">'+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+'</span>':"") }
  ruler.innerHTML=h; ruler.style.width=wpx+"px";
  const lanes=$("#lanes"); lanes.innerHTML="";
  TRACKS.forEach(k=>{
    const lane=document.createElement("div"); lane.className="lane"; lane.dataset.track=k; lane.style.width=wpx+"px";
    P.clips[k].slice().sort((a,b)=>a.start-b.start).forEach(c=>{
      const d=document.createElement("div");
      d.className="clip c-"+k+(sel&&sel.id===c.id?" sel":"");
      d.dataset.id=c.id;
      const a=k==="video"&&c.assetId?assets.get(c.assetId):null;
      if(a&&a.thumb){ d.style.backgroundImage="url("+a.thumb+")" }
      else if(k==="video"&&!c.assetId){ const g=CARD_BG[(c.bg||0)%CARD_BG.length]; d.style.background="linear-gradient(135deg,"+g[0]+","+g[1]+")" }
      d.innerHTML='<span class="hd l"></span><span class="lab">'+esc(clipLabel(k,c))+'</span><span class="hd r"></span>';
      layout(d,c); lane.appendChild(d);
    });
    lanes.appendChild(lane);
  });
  $("#inner").style.width=wpx+"px";
  ui_ph();
}
function layout(d,c){ d.style.left=(c.start*pps)+"px"; d.style.width=Math.max(10,c.dur*pps)+"px" }
function ui_ph(){ $("#ph").style.left=(time*pps)+"px" }
function ui_time(){ $("#tc").textContent=fmt(time)+" / "+fmt(dur()); ui_ph();
  const sc=$("#scroller"), x=time*pps;
  if(playing&&(x<sc.scrollLeft||x>sc.scrollLeft+sc.clientWidth-60))sc.scrollLeft=x-60 }
function ui_info(){ const el=$("#projInfo"); if(el)el.innerHTML=metaHTML() }

$("#lanes").addEventListener("pointerdown",e=>{
  const lane=e.target.closest(".lane"); if(!lane)return;
  const clipEl=e.target.closest(".clip");
  const k=lane.dataset.track;
  if(!clipEl){ const r=$("#inner").getBoundingClientRect(); seek((e.clientX-r.left)/pps); sel=null; ui_timeline(); ui_right(); return }
  const c=P.clips[k].find(x=>x.id===clipEl.dataset.id); if(!c)return;
  sel={k,id:c.id}; $$(".clip.sel").forEach(x=>x.classList.remove("sel")); clipEl.classList.add("sel"); ui_right();
  const edge=e.target.classList.contains("hd")?(e.target.classList.contains("l")?"l":"r"):null;
  const x0=e.clientX, s0=c.start, d0=c.dur, in0=c.in||0;
  let moved=false;
  clipEl.setPointerCapture(e.pointerId);
  const mv=ev=>{
    const dt=(ev.clientX-x0)/pps; if(Math.abs(ev.clientX-x0)<3&&!moved)return;
    if(!moved){moved=true;snapshot()}
    if(edge==="l"){ const ns=clamp(s0+dt,Math.max(0,s0-in0),s0+d0-.2); c.start=+snap(ns).toFixed(2); c.dur=+(d0-(c.start-s0)).toFixed(2); c.in=+(in0+(c.start-s0)).toFixed(2) }
    else if(edge==="r"){ c.dur=+Math.max(.2,snap(d0+dt)).toFixed(2) }
    else { c.start=+Math.max(0,snap(s0+dt)).toFixed(2) }
    layout(clipEl,c); clipEl.querySelector(".lab").textContent=clipLabel(k,c); $("#tc").textContent=fmt(time)+" / "+fmt(dur());
  };
  const up=()=>{ clipEl.removeEventListener("pointermove",mv); clipEl.removeEventListener("pointerup",up); if(moved){ui_timeline();ui_right();draw(time)} };
  clipEl.addEventListener("pointermove",mv); clipEl.addEventListener("pointerup",up);
});
$("#ruler").addEventListener("pointerdown",e=>{
  const r=$("#inner").getBoundingClientRect();
  const go=ev=>seek((ev.clientX-r.left)/pps); go(e);
  const up=()=>{window.removeEventListener("pointermove",go);window.removeEventListener("pointerup",up)};
  window.addEventListener("pointermove",go); window.addEventListener("pointerup",up);
});
$("#scroller").addEventListener("scroll",e=>{const w=$("#nmwrap");if(w)w.style.transform="translateY("+(-e.target.scrollTop)+"px)"});
$("#zoom").addEventListener("input",e=>{pps=+e.target.value;ui_timeline()});

function cutAt(){
  const c=selClip(); if(!c||sel.k==="fx"){toast("Chọn một đoạn trước đã");return}
  if(time<=c.start+.1||time>=c.start+c.dur-.1){toast("Đưa vạch phát vào giữa đoạn");return}
  snapshot();
  const b=JSON.parse(JSON.stringify(c)); b.id=uid();
  const cutDur=time-c.start;
  b.start=+time.toFixed(2); b.dur=+(c.dur-cutDur).toFixed(2); b.in=+((c.in||0)+cutDur*(c.speed||1)).toFixed(2);
  c.dur=+cutDur.toFixed(2);
  P.clips[sel.k].push(b); allUI(); toast("Đã cắt");
}
function delSel(){ if(!sel)return; snapshot(); P.clips[sel.k]=P.clips[sel.k].filter(c=>c.id!==sel.id); sel=null; allUI() }

/* ============================ nút & phím ============================ */
$("#btnPlay").onclick=toggle;
$("#btnHome").onclick=()=>seek(0);
$("#btnUndo").onclick=undo; $("#btnRedo").onclick=redo;
$("#btnCut").onclick=cutAt; $("#btnDel").onclick=delSel; $("#btnText").onclick=addTextLayer;
$("#btnAuto").onclick=()=>{step(2)};
$("#btnAll").onclick=()=>{ step(2); runAll() };
$("#btnExport").onclick=()=>{step(4)};
$("#btnNew").onclick=()=>{ if(dur()>0&&!confirm("Bỏ dự án hiện tại và bắt đầu dự án mới?"))return;
  snapshot(); P=blank("du_an_"+Math.floor(Date.now()/1e5)); $("#projName").value=P.name; sel=null; seek(0); allUI() };
$("#projName").oninput=e=>P.name=e.target.value;
$("#btnTheme").onclick=()=>{
  const d=document.documentElement.dataset.theme==="light";
  document.documentElement.dataset.theme=d?"dark":"light";
  $("#btnTheme").textContent=d?"☀ Nền sáng":"☾ Nền tối";
  try{localStorage.setItem("aes-theme",document.documentElement.dataset.theme)}catch(e){}
};
document.addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(e.key===" "){e.preventDefault();toggle()}
  else if(e.key==="s"||e.key==="S"){e.preventDefault();cutAt()}
  else if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();delSel()}
  else if(e.key==="ArrowLeft"){e.preventDefault();seek(time-(e.shiftKey?1:1/30))}
  else if(e.key==="ArrowRight"){e.preventDefault();seek(time+(e.shiftKey?1:1/30))}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo()}
});

/* ============================ khởi động ============================ */
function ui_status(){
  const vis=[...assets.values()].filter(a=>a.kind!=="audio").length;
  const aud=[...assets.values()].filter(a=>a.kind==="audio").length;
  const src=srcId&&assets.get(srcId);
  const nImg=[...assets.values()].filter(a=>a.kind==="image").length;
  const nBad=[...assets.values()].filter(a=>a.kind==="image"&&a.bad).length;
  let m;
  if(busy) m=busy;
  /* Báo trước mọi thứ khác: ảnh hỏng mà im lặng thì người dùng ngồi chờ một clip không bao giờ có hình. */
  else if(nBad&&nBad>=nImg) m=nBad+' ảnh máy không đọc được — thường là .HEIC của iPhone hoặc ảnh RAW. Đổi sang JPG rồi thả lại.';
  else if(nBad) m=nBad+'/'+nImg+' ảnh máy không đọc được (.HEIC hoặc RAW) nên bị bỏ qua. Số còn lại vẫn dựng bình thường.';
  else if(!vis) m='Thả cả thư mục ảnh vào đây, rồi bấm “AI làm hết”.';
  else if(nImg&&!AUTO._deduped) m=nImg+' ảnh. Bấm “AI làm hết” — app lọc ảnh trùng rồi Claude viết kịch bản.';
  else if(src&&!nImg&&!src.scenes) m='Có video nguồn rồi. Bấm “AI làm hết” để tách cảnh và dựng.';
  else if(!AUTO.approved) m='Kịch bản đang chờ bạn duyệt ở bước 2.';
  else if(!dur()) m='Chưa có gì trên timeline. Qua bước 2 duyệt kịch bản.';
  else if(!aud&&!P.clips.voice.length) m='Xong phần hình. Còn thiếu giọng đọc — xem khung Giọng đọc ở bước 1.';
  else if(!P.clips.sub.length) m='Chưa có phụ đề. Về bước 2 duyệt lại kịch bản.';
  else m='Sẵn sàng. Bấm “Xuất video” khi ưng.';
  $("#status").textContent=m;
}
function allUI(){ ui_left(); ui_right(); ui_timeline(); ui_status(); ui_time(); draw(time) }

try{ const th=localStorage.getItem("aes-theme"); document.documentElement.dataset.theme=th||"dark";
     $("#btnTheme").textContent=(th==="light")?"☾ Nền tối":"☀ Nền sáng"; }catch(e){ document.documentElement.dataset.theme="dark" }

runAuto().then(()=>{ step(1); seek(0) });
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw(time));
new ResizeObserver(()=>draw(time)).observe($("#cv"));
</script>
