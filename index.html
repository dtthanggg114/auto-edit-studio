<title>Auto Edit Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: khung app 4 vùng — thanh trên, 4 bước, 3 cột (kho file / màn hình / thuộc tính), timeline dưới cùng */
:root{
  --bg:#f6ecdd; --panel:#fffaf0; --panel2:#f3e4cd; --line:#e2cfae; --line2:#d3b98e;
  --fg:#30180e; --muted:#8a6a51; --accent:#c4631f; --accent-fg:#fff8ec;
  --hot:#b3331c; --gold:#d79a3c; --cream:#f7e9cc; --brick:#9e2b20;
  --clip-v:#cfa981; --clip-t:#e8d2ad; --clip-s:#dcc7a4; --clip-m:#dcc06a; --clip-fx:#8fc3c6;
  --shadow:0 10px 30px rgba(60,30,10,.12);
  --f-ui:"Be Vietnam Pro",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#140d0a; --panel:#1d1310; --panel2:#261913; --line:#3a2720; --line2:#4d342a;
  --fg:#f3e3d4; --muted:#b2917c; --accent:#e8913f; --accent-fg:#1a0f08;
  --hot:#c9502a; --gold:#e0b25e; --cream:#f7e9cc; --brick:#9e2b20;
  --clip-v:#355068; --clip-t:#3a2a21; --clip-s:#33251e; --clip-m:#5b4a1d; --clip-fx:#2d5f64;
  --shadow:0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#140d0a; --panel:#1d1310; --panel2:#261913; --line:#3a2720; --line2:#4d342a;
  --fg:#f3e3d4; --muted:#b2917c; --accent:#e8913f; --accent-fg:#1a0f08;
  --hot:#c9502a; --gold:#e0b25e; --cream:#f7e9cc; --brick:#9e2b20;
  --clip-v:#355068; --clip-t:#3a2a21; --clip-s:#33251e; --clip-m:#5b4a1d; --clip-fx:#2d5f64;
  --shadow:0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:10px;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- thanh trên ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:40px;height:40px;border-radius:11px;background:var(--cream);display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow)}
.mark svg{width:28px;height:28px;color:var(--brick)}
.brand b{font-weight:800;letter-spacing:.12em;font-size:12px;line-height:1.15;display:block}
.brand small{color:var(--muted);font-size:10px;letter-spacing:.22em;font-weight:600}
.proj-name{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:180px;flex:1 1 180px;max-width:320px;font-weight:600}
.spacer{flex:1 1 auto}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 80%,#000));border-color:transparent;color:var(--accent-fg)}
.btn.hot{background:linear-gradient(180deg,var(--hot),color-mix(in srgb,var(--hot) 78%,#000));border-color:transparent;color:#fff6ec}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- 4 bước ---------- */
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600;color:var(--muted)}
.step i{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.step[aria-current="true"]{color:var(--accent-fg);background:var(--accent);border-color:transparent}
.step[aria-current="true"] i{background:rgba(0,0,0,.22);color:inherit}
.status{color:var(--muted);font-weight:500;margin-left:4px}

/* ---------- bố cục 3 cột ---------- */
.workspace{display:grid;grid-template-columns:274px minmax(0,1fr) 288px;gap:10px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;display:flex;flex-direction:column}
.pane-scroll{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.ttl{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--muted);text-transform:uppercase}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:9px}

.drop{border:2px dashed var(--line2);border-radius:12px;padding:16px 12px;text-align:center;color:var(--muted);line-height:1.5}
.drop b{color:var(--accent)}
.drop.over{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);aspect-ratio:4/5;padding:0;display:block}
.tile img,.tile canvas{width:100%;height:100%;object-fit:cover;display:block}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.chip{position:absolute;background:rgba(10,6,4,.78);color:#fff0dd;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.chip.bl{left:5px;bottom:5px} .chip.br{right:5px;bottom:5px;background:rgba(10,6,4,.6)}
.chip.ok{color:#9fe0a0}
.rowline{display:flex;align-items:center;gap:8px}
.rowline .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:12.5px}
.rowline .dur{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700}
.mini.on{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.empty{color:var(--muted);font-size:12.5px;line-height:1.5}

.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.fld>span{display:flex;justify-content:space-between;gap:8px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:600;color:var(--fg);width:100%}
.fld textarea{resize:vertical;min-height:104px;line-height:1.55;font-weight:500}
.fld input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--fg)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.hint{color:var(--muted);font-size:11.5px;line-height:1.6}
kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 4px;font:inherit;font-size:11px;font-weight:700}

/* ---------- màn hình xem trước ---------- */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:12px;gap:10px;min-height:0}
/* Phải khai báo hàng. Grid không khai hàng thì canvas rơi vào hàng ngầm cỡ auto, hàng đó
   phình theo cỡ gốc 1080×1920 của canvas, còn height/max-height:100% của canvas không có
   chiều cao xác định nào để bám nên bị bỏ qua — khung xem trước tràn xuống đè cả timeline. */
.screen{display:grid;grid-template-rows:minmax(0,1fr);place-items:center;min-height:0;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--panel2) 70%,transparent),transparent);border-radius:10px;overflow:hidden}
/* để cỡ gốc 9:16 tự co vừa hộp theo CẢ hai chiều, đừng ép height rồi lại chặn max-width */
#cv{width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:9/16;border-radius:10px;background:#120b08;box-shadow:var(--shadow)}
.transport{display:flex;align-items:center;justify-content:center;gap:14px}
.rnd{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.rnd.play{width:50px;height:50px;background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.tc{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);min-width:120px;text-align:center}

/* ---------- timeline ---------- */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:296px;min-height:0}
.tl-bar{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl-bar .zoom{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:170px}
.tl-body{flex:1 1 auto;display:grid;grid-template-columns:76px minmax(0,1fr);min-height:0}
.lanes-names{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.lanes-names .sp{height:26px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.nmrow{height:46px;flex:0 0 auto;display:flex;align-items:center;padding-left:11px;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:1px solid transparent}
.scroller{overflow:auto;position:relative}
.inner{position:relative;min-width:100%}
.ruler{height:26px;position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line)}
.ruler .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.ruler .tk.maj{border-left-color:var(--line2)}
.ruler span{position:absolute;top:5px;left:5px;font-size:10px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lane{height:46px;position:relative;border-bottom:1px solid var(--line)}
.lane:nth-child(even){background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.clip{position:absolute;top:5px;height:36px;border-radius:7px;border:1px solid rgba(0,0,0,.28);overflow:hidden;display:flex;align-items:center;cursor:grab;touch-action:none;user-select:none}
.clip:active{cursor:grabbing}
.clip.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:3}
.clip .lab{position:relative;z-index:2;padding:0 7px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.5);color:#fff3e4}
.clip.c-video{background:var(--clip-v);background-size:auto 100%;background-repeat:repeat-x}
.clip.c-video .lab{background:rgba(12,8,5,.62);border-radius:5px;margin:0 4px;padding:2px 6px}
.clip.c-text{background:var(--clip-t);border-color:var(--line2)}
.clip.c-text .lab{color:var(--fg);text-shadow:none}
.clip.c-sub{background:var(--clip-s)} .clip.c-sub .lab{color:var(--fg);text-shadow:none}
.clip.c-voice{background:#6a4535} .clip.c-music{background:var(--clip-m)}
.clip.c-music .lab,.clip.c-voice .lab{color:#1b1109;text-shadow:none}
.clip.c-fx{background:var(--clip-fx);min-width:14px}
.clip.c-fx .lab{color:#06292c;text-shadow:none}
.clip .hd{position:absolute;top:0;bottom:0;width:7px;z-index:3;cursor:ew-resize}
.clip .hd.l{left:0} .clip .hd.r{right:0}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--hot);z-index:6;pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--hot)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.bar{height:8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0%}
video.result{width:100%;border-radius:10px;background:#000;display:block}

@media (max-width:1100px){ .workspace{grid-template-columns:238px minmax(0,1fr) 250px} }
@media (max-width:900px){
  body{overflow:auto;height:auto;grid-template-rows:none;display:block}
  .topbar,.steps{margin-bottom:10px}
  .workspace{display:flex;flex-direction:column;gap:10px}
  .pane{max-height:340px}
  .stage{height:min(74vh,620px)}
  .tl{height:300px;margin-top:10px}
}
/* Màn laptop 768–900px cao: timeline 296px ăn hết chỗ, khung xem trước dọc chỉ còn ~146px ngang,
   không duyệt nổi clip. Timeline rút ngắn vẫn dùng được vì .scroller cuộn và tên lane bám theo
   bằng translateY — chỉ phải cuộn để tới lane dưới. Khung xem trước thì không cuộn được. */
@media (min-width:901px) and (max-height:900px){ .tl{height:240px} }
@media (min-width:901px) and (max-height:800px){ .tl{height:200px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar">
  <div class="brand">
    <span class="mark" id="markBox"></span>
    <span><b>AUTO EDIT</b><small>STUDIO</small></span>
  </div>
  <input class="proj-name" id="projName" value="teaser_ai_tu_lam_v2" aria-label="Tên dự án">
  <span class="spacer"></span>
  <button class="btn ghost" id="btnTheme">☀ Nền sáng</button>
  <button class="btn" id="btnNew">+ Dự án mới</button>
  <button class="btn" id="btnAuto">⚙ Tự động edit</button>
  <button class="btn primary" id="btnAll">✨ AI làm hết</button>
  <button class="btn hot" id="btnExport">↑ Xuất video</button>
</header>

<nav class="steps" id="steps">
  <button class="step" data-step="1" aria-current="true"><i>1</i>Nhập file</button>
  <button class="step" data-step="2"><i>2</i>Tự động edit</button>
  <button class="step" data-step="3"><i>3</i>Xem &amp; chỉnh</button>
  <button class="step" data-step="4"><i>4</i>Xuất video</button>
  <span class="status" id="status"></span>
</nav>

<main class="workspace">
  <aside class="pane"><div class="pane-scroll" id="left"></div></aside>

  <section class="stage">
    <div class="screen"><canvas id="cv" width="1080" height="1920"></canvas></div>
    <div class="transport">
      <button class="rnd" id="btnHome" title="Về đầu">⏮</button>
      <button class="rnd play" id="btnPlay" title="Phát / dừng (Space)">▶</button>
      <span class="tc" id="tc">0:00.0 / 0:00.0</span>
    </div>
  </section>

  <aside class="pane"><div class="pane-scroll" id="right"></div></aside>
</main>

<section class="tl">
  <div class="tl-bar">
    <button class="btn" id="btnUndo">↺ Hoàn tác</button>
    <button class="btn" id="btnRedo">↻</button>
    <button class="btn" id="btnCut">✂ Cắt</button>
    <button class="btn" id="btnText">T Chữ</button>
    <button class="btn" id="btnDel">🗑 Xóa</button>
    <span class="spacer"></span>
    <label class="zoom">Thu phóng <input type="range" id="zoom" min="18" max="220" value="80"></label>
  </div>
  <div class="tl-body">
    <div class="lanes-names" id="names"><div class="sp"></div></div>
    <div class="scroller" id="scroller"><div class="inner" id="inner">
      <div class="ruler" id="ruler"></div>
      <div id="lanes"></div>
      <div class="playhead" id="ph" style="left:0"></div>
    </div></div>
  </div>
</section>

<input type="file" id="file" multiple accept="video/*,image/*,audio/*" hidden>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================ tiện ích ============================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=t=>{t=isFinite(t)?Math.max(0,t||0):0;const m=Math.floor(t/60);return m+":"+(t-m*60).toFixed(1).padStart(4,"0")};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Mở bằng file rời, máy không mạng thì font Google không tải được. Canvas không hiểu
   ui-sans-serif trên mọi bản Chrome, nên phải nêu thẳng font có sẵn trong Windows/macOS
   và có đủ dấu tiếng Việt, không thì chữ trên clip rơi về font mặc định xấu hoặc mất dấu. */
const FONT='"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
let _uiT=null;
function ui_soon(){ clearTimeout(_uiT); _uiT=setTimeout(()=>{ui_left();ui_status();ui_timeline()},140) }
/* nguồn vẽ có thể là <img>, <video> hoặc <canvas> đã thu nhỏ — mỗi loại đo kích thước một kiểu */
const iw=el=>(el&&(el.naturalWidth||el.videoWidth||el.width))||0;
const ih=el=>(el&&(el.naturalHeight||el.videoHeight||el.height))||0;
/* Ảnh máy ảnh 1926×2568 mà giữ nguyên thì 58 ảnh ngốn hơn 1GB bộ nhớ giải nén và vẽ rất chậm.
   Khung xuất chỉ 1080 rộng: ảnh 3:4 vừa khung dọc chỉ được vẽ ở 1080×1440, nên cạnh dài 1500 là thừa đủ. */
const IMG_CAP=1500;
function shrink(img){
  const sw=iw(img), sh=ih(img);
  if(!sw||!sh)return null;
  const sc=IMG_CAP/Math.max(sw,sh);
  if(sc>=1)return null;
  const c=document.createElement("canvas");
  c.width=Math.round(sw*sc); c.height=Math.round(sh*sc);
  try{ c.getContext("2d").drawImage(img,0,0,c.width,c.height) }catch(e){ return null }
  return c;
}

const LOGO_SVG='<svg viewBox="0 0 64 64" fill="currentColor" xmlns="http://www.w3.org/2000/svg">'+
 '<path d="M33 6 46 21H20z"/><circle cx="33" cy="25" r="3.6"/>'+
 '<path d="M30.6 29h4.8l-1.2 12 3.4 13h-10l3.6-13z"/>'+
 '<path d="M9 25.5 56 20l.5 3.4L9.5 29z"/>'+
 '<path d="M4.5 29.5h13c0 5-2.9 8-6.5 8s-6.5-3-6.5-8zm42.5-5h13c0 5-2.9 8-6.5 8s-6.5-3-6.5-8z"/></svg>';
$("#markBox").innerHTML=LOGO_SVG;
const logoImg=new Image();
/* SVG chỉ có viewBox, không có width/height thì Chrome coi như không có kích thước gốc
   và vẽ tràn khung dù đã truyền dw/dh — phải ghi kích thước thật vào chuỗi SVG. */
logoImg.src="data:image/svg+xml;utf8,"+encodeURIComponent(
  LOGO_SVG.replace('fill="currentColor"','fill="#9e2b20"').replace('<svg ','<svg width="170" height="170" '));

/* ============================ dữ liệu ============================ */
const TRACKS=["text","sub","video","voice","music","fx"];
const LABEL={text:"Chữ",sub:"Phụ đề",video:"Video",voice:"Voice",music:"Nhạc",fx:"Hiệu ứng"};
const EFFECTS={none:"không",
  kbin:"nhích vào (nhẹ)",kbout:"nhích ra (nhẹ)",kbup:"trôi lên",kbdn:"trôi xuống",kbl:"trôi trái",kbr:"trôi phải",

let ac=null, master=null, sources=[];
function audio(){ if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination)} if(ac.state==="suspended")ac.resume(); return ac }
const m2f=m=>440*Math.pow(2,(m-69)/12);
function tone(oc,dst,f,t0,len,type,g0,detune){
  const o=oc.createOscillator();o.type=type||"sine";o.frequency.value=f;if(detune)o.detune.value=detune;
  const g=oc.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(g0,t0+Math.min(.08,len*.3));
  g.gain.exponentialRampToValueAtTime(.0001,t0+len);
  o.connect(g).connect(dst);o.start(t0);o.stop(t0+len+.05);
}
function noiseBuf(oc,len){const b=oc.createBuffer(1,Math.ceil(oc.sampleRate*len),oc.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function noise(oc,dst,t0,len,f0,f1,g0,q){
  const s=oc.createBufferSource();s.buffer=noiseBuf(oc,len);
  const bp=oc.createBiquadFilter();bp.type="bandpass";bp.Q.value=q||1.1;
  bp.frequency.setValueAtTime(f0,t0);bp.frequency.exponentialRampToValueAtTime(f1,t0+len);
  const g=oc.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(g0,t0+len*.25);
  g.gain.exponentialRampToValueAtTime(.0001,t0+len);
  s.connect(bp).connect(g).connect(dst);s.start(t0);s.stop(t0+len);
}
/* nốt piano mềm: 3 hòa âm sine tắt dần — nghe gần đàn thật hơn sine trơn */
function pno(oc,dst,f,t0,g0){
  [[1,1,1.9],[2,.3,1.1],[3,.1,.7]].forEach(([h,a,len])=>{
    const o=oc.createOscillator();o.type="sine";o.frequency.value=f*h;
    const g=oc.createGain();
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(g0*a,t0+.014);
    g.gain.exponentialRampToValueAtTime(.00008,t0+len);
    o.connect(g).connect(dst);o.start(t0);o.stop(t0+len+.05);
  });
}
/* pad: vào chậm ra chậm, dùng làm nền dịu — tone() vào quá nhanh nên không dùng được */
function pad(oc,dst,f,t0,len,g0,type){
  const o=oc.createOscillator();o.type=type||"triangle";o.frequency.value=f;
  const g=oc.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(g0,t0+len*.34);
  g.gain.linearRampToValueAtTime(g0*.82,t0+len*.72);
  g.gain.linearRampToValueAtTime(0,t0+len);
  o.connect(g).connect(dst);o.start(t0);o.stop(t0+len+.05);
}
/* ===== nhạc cụ =====
   Bản cũ dùng pno()/pad(): 3 sóng sine và một dao động trơn, mono, "vang" chỉ là một tiếng
   vọng 0.33s. Nghe ra tiếng máy ngay. Bốn thứ dưới đây là khác biệt giữa "tiếng sine" và
   "nghe ra cây đàn": bồi âm lệch nhẹ (dây thật không chia đúng bội số nguyên), tiếng búa gõ,
   nốt trầm ngân lâu hơn nốt cao, đánh mạnh thì sáng hơn. */
function irBuf(oc,len,decay){
  const n=Math.ceil(oc.sampleRate*len), b=oc.createBuffer(2,n,oc.sampleRate), pre=oc.sampleRate*.014;
  for(let c=0;c<2;c++){ const d=b.getChannelData(c);
    for(let i=0;i<n;i++){ const t=i/n;
      d[i]=i<pre?0:(Math.random()*2-1)*Math.pow(1-t,decay||2.6); } }
  return b;
}
function pan(oc,x){ const p=oc.createStereoPanner?oc.createStereoPanner():null; if(p)p.pan.value=x||0; return p }
function conn(a,b,dst){ if(b){a.connect(b);b.connect(dst)} else a.connect(dst) }
function piano(oc,dst,f,t0,vel,px,susMul){
  vel=vel==null?.6:vel;
  const dur=Math.min(7,(1.0+560/f)*(susMul||1));
  const lp=oc.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.setValueAtTime(Math.min(15000,f*5.5+2600*vel),t0);
  lp.frequency.exponentialRampToValueAtTime(Math.max(320,f*2.1),t0+dur*.55);
  const amp=oc.createGain();
  amp.gain.setValueAtTime(0,t0);
  amp.gain.linearRampToValueAtTime(vel,t0+.006);
  amp.gain.exponentialRampToValueAtTime(Math.max(.0002,vel*.30),t0+.26);
  amp.gain.exponentialRampToValueAtTime(.00008,t0+dur);
  const p=pan(oc,px); lp.connect(amp); conn(amp,p,dst);
  const B=.0004;
  [[1,1],[2,.40],[3,.21],[4,.10]].forEach(([h,a])=>{
    const o=oc.createOscillator(); o.type="sine";
    o.frequency.value=f*h*Math.sqrt(1+B*h*h);
    const g=oc.createGain(); g.gain.value=a;
    o.connect(g).connect(lp); o.start(t0); o.stop(t0+dur+.04);
  });
  /* Tiếng búa gõ vào dây — rất ngắn, nhưng thiếu nó là mất hẳn chất đàn.
     Chỉ làm cho nốt đánh mạnh: nốt rải nhỏ tiếng thì không ai nghe ra, mà mỗi nốt tốn
     thêm bốn nút xử lý — bỏ bớt ở đây là render nhanh hẳn. */
  if(vel>=.15){
    const s=oc.createBufferSource(); s.buffer=noiseBuf(oc,.03);
    const hp=oc.createBiquadFilter(); hp.type="bandpass"; hp.frequency.value=Math.min(7000,f*4); hp.Q.value=.7;
    const hg=oc.createGain();
    hg.gain.setValueAtTime(vel*.10,t0); hg.gain.exponentialRampToValueAtTime(.00005,t0+.028);
    s.connect(hp).connect(hg); conn(hg,pan(oc,px),dst); s.start(t0); s.stop(t0+.035);
  }
}
/* dàn dây: ba bè lệch nhau vài cent, lọc mở dần — nền ấm, không đứng yên một chỗ */
function strings(oc,dst,f,t0,len,g0,px){
  const lp=oc.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.setValueAtTime(f*2.6+420,t0);
  lp.frequency.linearRampToValueAtTime(f*4.6+900,t0+len*.55);
  lp.frequency.linearRampToValueAtTime(f*2.8+500,t0+len);
  const amp=oc.createGain();
  amp.gain.setValueAtTime(0,t0);
  amp.gain.linearRampToValueAtTime(g0,t0+Math.min(1.3,len*.38));
  amp.gain.linearRampToValueAtTime(g0*.88,t0+len*.74);
  amp.gain.linearRampToValueAtTime(0,t0+len);
  const p=pan(oc,px); lp.connect(amp); conn(amp,p,dst);
  [[-8,"sawtooth",.17],[0,"triangle",.5],[9,"sawtooth",.17]].forEach(([c,ty,a])=>{
    const o=oc.createOscillator(); o.type=ty; o.frequency.value=f; o.detune.value=c;
    const g=oc.createGain(); g.gain.value=a;
    o.connect(g).connect(lp); o.start(t0); o.stop(t0+len+.05);
  });
}
function bass(oc,dst,f,t0,len,g0){
  const lp=oc.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=Math.max(180,f*4);
  const amp=oc.createGain();
  amp.gain.setValueAtTime(0,t0); amp.gain.linearRampToValueAtTime(g0,t0+.05);
  amp.gain.linearRampToValueAtTime(g0*.75,t0+len*.6);
  amp.gain.linearRampToValueAtTime(0,t0+len);
  lp.connect(amp).connect(dst);
  [[1,"sine",1],[2,"triangle",.14]].forEach(([h,ty,a])=>{
    const o=oc.createOscillator(); o.type=ty; o.frequency.value=f*h;
    const g=oc.createGain(); g.gain.value=a;
    o.connect(g).connect(lp); o.start(t0); o.stop(t0+len+.04);
  });
}
/* hộp nhạc: bồi âm cao lệch nhiều, tắt nhanh — tiếng đồ chơi treo nôi */
function mbox(oc,dst,f,t0,g0,px){
  const p=pan(oc,px); const amp=oc.createGain();
  amp.gain.setValueAtTime(0,t0); amp.gain.linearRampToValueAtTime(g0,t0+.004);
  amp.gain.exponentialRampToValueAtTime(.00006,t0+1.5);
  conn(amp,p,dst);
  [[1,1],[2.76,.30],[5.4,.12],[8.9,.05]].forEach(([h,a])=>{
    const o=oc.createOscillator(); o.type="sine"; o.frequency.value=f*h;
    const g=oc.createGain(); g.gain.value=a;
    o.connect(g).connect(amp); o.start(t0); o.stop(t0+1.55);
  });
}
function kick(oc,dst,t0,g0){
  const o=oc.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(115,t0); o.frequency.exponentialRampToValueAtTime(42,t0+.13);
  const g=oc.createGain();
  g.gain.setValueAtTime(g0,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
  o.connect(g).connect(dst); o.start(t0); o.stop(t0+.32);
}
function shake(oc,dst,t0,g0,px){
  const s=oc.createBufferSource(); s.buffer=noiseBuf(oc,.07);
  const bp=oc.createBiquadFilter(); bp.type="highpass"; bp.frequency.value=5200;
  const g=oc.createGain();
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(g0,t0+.008);
  g.gain.exponentialRampToValueAtTime(.00008,t0+.065);
  s.connect(bp).connect(g); conn(g,pan(oc,px),dst); s.start(t0); s.stop(t0+.08);
}

const LIB_MUSIC=[
  {id:"am_ap",nm:"Ấm áp — piano + dàn dây, cảm động",d:48},
  {id:"con_yeu",nm:"Con yêu — hộp nhạc ru, cho sơ sinh",d:44},
  {id:"hy_vong",nm:"Hy vọng — dâng dần, vỡ oà",d:45.6},
  {id:"beat_nhe",nm:"Nhịp nhẹ — trẻ trung, ấm",d:17*240/92},
  {id:"nen_diu_nhe",nm:"Nền dịu — mỏng, để lót giọng đọc",d:44},
  {id:"cam_hung",nm:"Cảm hứng — sáng, nhiều chuyển động",d:43.2}];
const LIB_FX=[
  {id:"lap_lanh",nm:"Lấp lánh (nhẹ, cảm động)",d:1.6},
  {id:"hoi_tho",nm:"Hơi thở (dẫn vào)",d:1.8},
  {id:"chuyen_canh",nm:"Chuyển cảnh (vút)",d:.55},
  {id:"dang_len",nm:"Dâng lên (dẫn vào)",d:1.3},
  {id:"dinh",nm:"Đinh (nhấn mạnh)",d:1.1}];
const libCache=new Map();
async function lib(id){
  if(libCache.has(id))return libCache.get(id);
  const meta=[...LIB_MUSIC,...LIB_FX].find(x=>x.id===id);const sr=44100;
  const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(2,Math.ceil(sr*meta.d),sr);
  const out=oc.createGain();out.gain.value=.8;out.connect(oc.destination);
  /* Vang thật bằng ConvolverNode (nhiễu tắt dần làm đáp ứng xung) thay cho một tiếng vọng 0.33s.
     Đây là thứ kéo chất lượng lên nhiều nhất — không có nó thì nốt nào cũng nghe trơ. */
  const mix=oc.createGain(), rev=oc.createGain();
  mix.connect(out);
  const cvv=oc.createConvolver(); cvv.buffer=irBuf(oc,2.0,2.4);
  rev.gain.value=.34; mix.connect(rev); rev.connect(cvv); cvv.connect(out);
  /* FX cũ vẫn đi đường cũ cho khỏi đổi tiếng */
  const dl=oc.createDelay(1);dl.delayTime.value=.33;const fb=oc.createGain();fb.gain.value=.28;
  const wet=oc.createGain();wet.gain.value=.3;out.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(oc.destination);

  if(id==="am_ap"){
    /* "Ấm áp" — Đô trưởng, C–G/B–Am–F, 70 nhịp/phút. Có giai điệu hẳn hoi chứ không chỉ rải hợp âm.
       Bố cục 14 ô nhịp: 2 ô mở nhỏ tiếng (nhường câu móc) → vào giai điệu → nhắc lại cao hơn →
       đẩy lên rồi lắng xuống. Kết về Đô để lúc lặp lại không bị gợn. */
    const bar=24/7;                                  /* 70 bpm, 4 phách */
    const prog=[[60,64,67],[59,62,67],[57,60,64],[53,57,60]];
    const mel=[[[0,67,1.5],[1.5,64,.5],[2,65,1],[3,64,1]],
               [[0,62,1.5],[1.5,59,.5],[2,62,1],[3,64,1]],
               [[0,64,1],[1,67,1],[2,69,1.5],[3.5,67,.5]],
               [[0,65,2],[2,64,2]]];
    for(let b=0;b<14;b++){
      const t0=b*bar, ch=prog[b%4], beat=bar/4;
      const intro=b<2, lift=b>=10;
      const gr=intro?.45:(b<6?.82:(lift?1:.92));
      bass(oc,mix,m2f(ch[0]-24),t0,bar*.98,.16*gr);
      ch.forEach((n,i)=>strings(oc,mix,m2f(n-12),t0,bar*1.01,.055*gr,(i-1)*.45));
      if(lift)ch.forEach((n,i)=>strings(oc,mix,m2f(n),t0,bar*1.01,.028,(1-i)*.5));
      /* rải tay trái, lệch trái một chút */
      const arp=[0,1,2,1,2,1,0,1];
      for(let s=0;s<8;s++){
        const up=s>=4?12:0;
        piano(oc,mix,m2f(ch[arp[s]]+up),t0+s*beat/2,(intro?.10:.17)*(s%2?.66:1),-.26);
      }
      /* giai điệu tay phải, lệch phải, từ ô nhịp 2 trở đi; nhắc lại thì cao hơn một quãng tám */
      if(b>=2){
        const ph=mel[(b-2)%4], oct=(b>=6&&b<10)?12:0;
        ph.forEach(([p,n,l])=>piano(oc,mix,m2f(n+oct),t0+p*beat,(lift?.34:.27),.24,l*.9));
      }
      if(b%4===0&&b>0)mbox(oc,mix,m2f(ch[2]+24),t0,.07,.4);
    }
  }else if(id==="con_yeu"){
    /* "Con yêu" — hộp nhạc treo nôi. C–Am–F–G, rất thưa, rất nhẹ. Hợp ảnh sơ sinh nhất. */
    const bar=4, prog=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
    const tune=[[0,72,1],[1,76,1],[2,79,2],[0,77,1],[1,76,1],[2,72,2],
                [0,74,1],[1,77,1],[2,81,2],[0,79,1],[1,74,1],[2,67,2]];
    for(let b=0;b<11;b++){
      const t0=b*bar, ch=prog[b%4], gr=b<1?.5:1;
      bass(oc,mix,m2f(ch[0]-24),t0,bar*.96,.10*gr);
      ch.forEach((n,i)=>strings(oc,mix,m2f(n-12),t0,bar*1.01,.034*gr,(i-1)*.4));
      if(b>=1){
        const ph=tune.slice(((b-1)%4)*3,((b-1)%4)*3+3);
        ph.forEach(([p,n])=>mbox(oc,mix,m2f(n),t0+p*(bar/3),.17,(p-1)*.35));
      }
      /* một nốt piano trầm mỗi hai ô nhịp, như nhịp đung đưa */
      if(b%2===0)piano(oc,mix,m2f(ch[0]-12),t0,.13,-.2);
    }
  }else if(id==="hy_vong"){
    /* "Hy vọng" — F–G–Am–Am–F–G–C–C, to dần đều rồi vỡ ra ở ô nhịp cuối. */
    const bar=3.8;
    const prog=[[53,57,60],[55,59,62],[57,60,64],[57,60,64],
                [53,57,60],[55,59,62],[60,64,67],[60,64,67],
                [53,57,60],[55,59,62],[60,64,67],[60,64,67]];
    const mel=[0,0,69,67,0,71,72,74,0,71,72,76];
    for(let b=0;b<12;b++){
      const t0=b*bar, ch=prog[b], beat=bar/4, gr=.52+b*.045;
      bass(oc,mix,m2f(ch[0]-24),t0,bar*.98,.17*gr);
      ch.forEach((n,i)=>strings(oc,mix,m2f(n-12),t0,bar*1.01,.05*gr,(i-1)*.42));
      if(b>=6)ch.forEach((n,i)=>strings(oc,mix,m2f(n),t0,bar*1.01,.026*gr,(1-i)*.5));
      for(let s=0;s<6;s++)piano(oc,mix,m2f(ch[s%3]+(s>2?12:0)),t0+s*(bar/6),.15*gr*(s%2?.7:1),-.22);
      if(mel[b])piano(oc,mix,m2f(mel[b]),t0+beat*.5,.30*gr,.26,1.6);
      if(b>=8)mbox(oc,mix,m2f(ch[2]+24),t0+beat*2,.08,.45);
    }
  }else if(id==="beat_nhe"){
    /* "Nhịp nhẹ" — trẻ trung: trống êm ở phách 1 và 3, lắc tay đều, piano bấm hợp âm.
       92 nhịp/phút. Vẫn ấm, không thành nhạc quảng cáo. */
    const bar=240/92, prog=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
    for(let b=0;b<17;b++){
      const t0=b*bar, ch=prog[b%4], beat=bar/4, gr=b<2?.55:1;
      bass(oc,mix,m2f(ch[0]-24),t0,bar*.95,.15*gr);
      ch.forEach((n,i)=>strings(oc,mix,m2f(n-12),t0,bar*1.01,.04*gr,(i-1)*.4));
      if(b>=2){
        kick(oc,mix,t0,.5); kick(oc,mix,t0+beat*2,.42);
        for(let s=0;s<8;s++)shake(oc,mix,t0+s*beat/2,(s%2?.055:.085)*gr,s%2?.3:-.3);
      }
      /* bấm hợp âm lệch phách cho có nhún */
      [0,1.5,2.5].forEach((p,i)=>ch.forEach((n,j)=>
        piano(oc,mix,m2f(n+(i===2?12:0)),t0+p*beat,.13*gr,(j-1)*.2,.7)));
      if(b>=6&&b%2===0)piano(oc,mix,m2f(ch[2]+12),t0+beat*3,.22*gr,.3,1.4);
    }
  }else if(id==="nen_diu_nhe"){

    const bar=3.6, prog=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
    for(let b=0;b<12;b++){
      const t0=b*bar, ch=prog[b%4], gr=b<2?.6:1;
      bass(oc,mix,m2f(ch[0]-24),t0,bar*.97,.15*gr);

    const g=oc.createGain();g.gain.setValueAtTime(.001,0);g.gain.exponentialRampToValueAtTime(.18,1.15);g.gain.exponentialRampToValueAtTime(.001,1.28);
    o.connect(g).connect(out);o.start(0);o.stop(1.3) }

  const buf=await oc.startRendering();
  /* Các bản tự sinh ra rất nhỏ tiếng: cộng mấy chục nốt gain thấp lại đỉnh mới ~0.13–0.17,
     nhân tiếp âm lượng clip 0.26 là coi như câm. Chuẩn hoá về đỉnh 0.85 để bản nào cũng đều tiếng. */
  let pk=0;
  for(let c=0;c<buf.numberOfChannels;c++){
    const d=buf.getChannelData(c);

}

async function scheduleAudio(from){
  audio();const end=dur();
  const jobs=[];
  if(exporting&&EXP.audio==="silent")return;   /* xuất bản câm: không xếp tiếng nào cả */
  for(const k of ["voice","music","fx"]){
    /* đang xuất bản "không nhạc nền" thì bỏ hẳn track nhạc — giọng đọc, tiếng outro vẫn giữ */
    if(k==="music"&&exporting&&EXP.audio==="nomusic")continue;
    for(const c of P.clips[k]){
      const cEnd=Math.min(c.start+c.dur,end); if(cEnd<=from) continue;
      jobs.push([k,c,cEnd]);
    }
  }
  for(const [k,c,cEnd] of jobs){
    let buf=null;
    if(c.libId) buf=await lib(c.libId);
    else { const a=assets.get(c.assetId); buf=a&&a.buffer }
    if(!buf) continue;
    const when=ac.currentTime+Math.max(0,c.start-from);
    const off=(c.in||0)+Math.max(0,from-c.start);
    const len=cEnd-Math.max(c.start,from);
    const s=ac.createBufferSource();s.buffer=buf;
    if(buf.duration<c.dur+ (c.in||0)) {s.loop=true}
    const g=ac.createGain();g.gain.value=(c.vol==null?1:c.vol);
    s.connect(g).connect(master);
    try{ s.start(when,off%Math.max(.01,buf.duration),s.loop?undefined:len); if(s.loop)s.stop(when+len) }catch(e){}
    sources.push(s);
  }
}

    case"kbin":return{s:1+.13*p,x:0,y:-.012*p};
    case"kbout":return{s:1.13-.13*p,x:0,y:.012*p};
    case"kbup":return{s:1.11,x:0,y:(p-.5)*.062};
    case"kbdn":return{s:1.11,x:0,y:(.5-p)*.062};

    case"kbl":return{s:1.11,x:(.5-p)*.085,y:0};
    case"kbr":return{s:1.11,x:(p-.5)*.085,y:0};
    case"zoomin":return{s:1+.11*p,x:0,y:0};

function syncVideo(t){
  for(const a of assets.values()){
    if(a.kind!=="video"||!a.el)continue;
    const c=P.clips.video.find(c=>c.assetId===a.id&&t>=c.start&&t<c.start+c.dur);
    if(c){ const want=(c.in||0)+(t-c.start)*(c.speed||1);
      a.el.playbackRate=c.speed||1;
      /* tiếng của outro đi thẳng từ thẻ <video> chứ không qua scheduleAudio, nên phải tắt riêng */
      if(a.gn)a.gn.gain.value=(exporting&&EXP.audio==="silent")?0:(c.vol==null?0:c.vol);
      if(playing){ if(Math.abs(a.el.currentTime-want)>.22)a.el.currentTime=want; if(a.el.paused)a.el.play().catch(()=>{}) }
      else { if(!a.el.paused)a.el.pause(); if(Math.abs(a.el.currentTime-want)>.03)a.el.currentTime=want }
    } else if(!a.el.paused) a.el.pause();
  }
}

   Nên hẹn thêm một đồng hồ chạy song song: cái nào tới trước thì chạy, cái kia huỷ. */
function nextFrame(fn){
  let fired=false;

  raf=requestAnimationFrame(go); rafT=setTimeout(go,30);
}
function loop(ts){
  if(!playing)return;
  time=Math.min(dur(),time+(ts-last)/1000); last=ts;
  syncVideo(time); draw(time); ui_time();
  if(time>=dur()-1e-3){ pause(); const f=onEnd; onEnd=null; if(f)f(); return }
  nextFrame(loop);
}
async function play(){
  if(playing||dur()<=0)return;
  if(time>=dur()-.02)time=0;
  playing=true; $("#btnPlay").textContent="❚❚";
  for(const a of assets.values()) if(a.kind==="video"&&a.el) mediaGain(a);
  await scheduleAudio(time);

}

/* webm do trình duyệt tự quay không ghi độ dài — ép nó tính ra bằng cách tua tới vô cực */
function realDuration(el){
  return new Promise(res=>{
    let settled=false;
    const fin=d=>{ if(settled)return; settled=true; el.removeEventListener("timeupdate",tu); res(isFinite(d)&&d>0?d:0) };
    const tu=()=>{ if(isFinite(el.duration)&&el.duration>0){ const d=el.duration; try{el.currentTime=0}catch(e){} fin(d) } };
    if(isFinite(el.duration)&&el.duration>0)return fin(el.duration);
    el.addEventListener("timeupdate",tu);
    try{ el.currentTime=1e101 }catch(e){ fin(0) }
    setTimeout(()=>fin(el.duration),4000);
  });

      const a={id,kind:"audio",name:f.name,url,d:0,buffer:null,speech:[],role:guessMusic?"music":"voice"};
      assets.set(id,a);n++;

/* ===================== đọc video nguồn: tách cảnh + lấy khung hình ===================== */
function seekTo(el,t){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(done)return; done=true; el.removeEventListener("seeked",fin); res() };
    el.addEventListener("seeked",fin);
    try{ el.currentTime=Math.max(0,Math.min(t,(el.duration||t)-.05)) }catch(e){ fin() }
    setTimeout(fin,500);
  });
}
function sigOf(d){ /* chữ ký khung hình: lưới 4×4, mỗi ô 3 màu */
  const {data,width:w,height:h}=d, out=new Float32Array(48);
  for(let gy=0;gy<4;gy++)for(let gx=0;gx<4;gx++){
    let r=0,g=0,b=0,n=0;
    const x0=Math.floor(gx*w/4),x1=Math.floor((gx+1)*w/4),y0=Math.floor(gy*h/4),y1=Math.floor((gy+1)*h/4);
    for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const i=(y*w+x)*4;r+=data[i];g+=data[i+1];b+=data[i+2];n++}
    const k=(gy*4+gx)*3; out[k]=r/n; out[k+1]=g/n; out[k+2]=b/n;
  }
  return out;
}
const sigDist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length/255};

/* ===== lọc ảnh trùng =====
   Ảnh chụp liên thanh thì gần y hệt nhau; rải hết vào clip là thấy đúp ngay.
   Chữ ký lưới 8×8×RGB để so, và đo độ nét để trong một chùm thì giữ đúng ảnh rõ nhất. */
function sig8(src){
  const c=document.createElement("canvas"); c.width=8; c.height=8;
  const g=c.getContext("2d",{willReadFrequently:true});
  try{ g.drawImage(src,0,0,8,8) }catch(e){ return null }
  const d=g.getImageData(0,0,8,8).data, out=new Float32Array(192);
  for(let i=0;i<64;i++){ out[i*3]=d[i*4]; out[i*3+1]=d[i*4+1]; out[i*3+2]=d[i*4+2] }
  return out;
}
function sharpOf(src){
  const n=64, c=document.createElement("canvas"); c.width=n; c.height=n;
  const g=c.getContext("2d",{willReadFrequently:true});
  try{ g.drawImage(src,0,0,n,n) }catch(e){ return 0 }
  const d=g.getImageData(0,0,n,n).data;
  const lum=i=>d[i]*.3+d[i+1]*.59+d[i+2]*.11;
  let s=0;
  for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++){
    const l=lum((y*n+x)*4);
    s+=Math.abs(l-lum((y*n+x+1)*4))+Math.abs(l-lum(((y+1)*n+x)*4));
  }
  return s/((n-2)*(n-2));
}
function imgMeta(a){ if(a.sig)return; a.sig=sig8(a.el); a.sharp=sharpOf(a.el) }
/* ngưỡng 12/255 là số đo được trên chính bộ ảnh của chủ dự án: 58 ảnh → 42 nhóm */
function dedupe(thr){
  const imgs=[...assets.values()].filter(a=>a.kind==="image"&&iw(a.el)).sort(nameSort);
  imgs.forEach(a=>{ imgMeta(a); a.dup=false });
  const T=thr==null?12:thr, keep=[];
  for(const a of imgs){
    if(!a.sig){ keep.push(a); continue }
    const j=keep.findIndex(b=>b.sig&&sigDist(a.sig,b.sig)*255<T);
    if(j<0){ keep.push(a); continue }
    if((a.sharp||0)>(keep[j].sharp||0)*1.06){ keep[j].dup=true; keep[j]=a }   /* ảnh này nét hơn, giữ nó */
    else a.dup=true;
  }
  AUTO._deduped=true;
  return {total:imgs.length,kept:keep.length};
}
const nameSort=(a,b)=>String(a.name||"").localeCompare(String(b.name||""),"vi",{numeric:true});
const liveImgs=()=>[...assets.values()].filter(a=>a.kind==="image"&&iw(a.el)&&!(AUTO.dedup&&a.dup)).sort(nameSort);

async function analyzeSource(a,onProg){
  if(!a||a.kind!=="video"||!a.el)return null;
  let d=a.d; if(!isFinite(d)||d<=0){ d=await realDuration(a.el); a.d=d }
  if(!isFinite(d)||d<=0)return null;
  const el=a.el;
  const was=el.currentTime, wasPaused=el.paused; el.pause();
  const cw=96,ch=170, c=document.createElement("canvas"); c.width=cw;c.height=ch;
  const g=c.getContext("2d",{willReadFrequently:true});
  const step=d>120?.8:.4, sigs=[], times=[];
  for(let t=0;t<d-.05;t+=step){
    await seekTo(el,t);
    try{ g.drawImage(el,0,0,cw,ch) }catch(e){ break }
    sigs.push(sigOf(g.getImageData(0,0,cw,ch))); times.push(t);
    if(onProg)onProg(t/d);
  }
  if(sigs.length<3){ a.scenes=[{start:0,end:d}]; return a.scenes }
  const diffs=[0]; for(let i=1;i<sigs.length;i++)diffs.push(sigDist(sigs[i-1],sigs[i]));
  const srt=diffs.slice(1).sort((x,y)=>x-y), med=srt[Math.floor(srt.length/2)]||0;
  const thr=Math.max(.045,med*3.4);
  const cuts=[0];
  for(let i=1;i<diffs.length;i++) if(diffs[i]>thr&&times[i]-cuts[cuts.length-1]>1.1) cuts.push(times[i]);
  const scenes=cuts.map((s,i)=>({start:+s.toFixed(2),end:+((cuts[i+1]!=null?cuts[i+1]:d)).toFixed(2)}))
                   .filter(s=>s.end-s.start>.7);
  a.scenes=scenes.length?scenes:[{start:0,end:d}];
  /* 6 khung hình đại diện để Claude xem */
  a.shots=[];
  const pick=a.scenes.length<=6?a.scenes:Array.from({length:6},(_,i)=>a.scenes[Math.floor(i*a.scenes.length/6)]);
  const sc2=document.createElement("canvas"); sc2.width=432; sc2.height=768;
  const g2=sc2.getContext("2d");
  for(const s of pick){
    await seekTo(el,(s.start+s.end)/2);
    try{ g2.drawImage(el,0,0,432,768) }catch(e){ continue }
    const blob=await new Promise(r=>sc2.toBlob(r,"image/jpeg",.82));
    if(blob)a.shots.push({t:(s.start+s.end)/2,blob});
  }
  await seekTo(el,was); if(!wasPaused)el.play().catch(()=>{});
  return a.scenes;
}

/* ===================== dò tiếng nói trong file voice ===================== */
function speechOf(buf){
  if(!buf)return [];
  const ch=buf.getChannelData(0), sr=buf.sampleRate, win=Math.max(1,Math.round(sr*.02));
  const en=[];
  for(let i=0;i+win<ch.length;i+=win){ let s=0; for(let j=0;j<win;j+=2)s+=ch[i+j]*ch[i+j]; en.push(Math.sqrt(s/(win/2))) }
  if(en.length<5)return [];
  const srt=[...en].sort((a,b)=>a-b);
  const floor=srt[Math.floor(srt.length*.2)]||0, peak=srt[Math.floor(srt.length*.95)]||.01;
  const thr=floor+(peak-floor)*.16;
  const segs=[]; let st=null;
  for(let i=0;i<en.length;i++){
    const on=en[i]>thr, t=i*.02;
    if(on&&st==null)st=t;
    else if(!on&&st!=null){ segs.push({start:st,end:t}); st=null }
  }
  if(st!=null)segs.push({start:st,end:en.length*.02});
  const out=[];
  for(const s of segs){
    const last=out[out.length-1];
    if(last&&s.start-last.end<.38)last.end=s.end; else out.push({...s});
  }
  return out.filter(s=>s.end-s.start>.3).map(s=>({start:+s.start.toFixed(2),end:+s.end.toFixed(2)}));
}

/* ===================== Claude viết kịch bản ===================== */
/* Ảnh gửi cho Claude xem: lấy đều khắp bộ ảnh (sau khi lọc trùng) theo đúng thứ tự,
   giữ nguyên tỉ lệ trên nền đen để Claude thấy đúng khung ảnh gốc. */
async function aiShots(max){
  const imgs=liveImgs();
  if(imgs.length){
    const n=Math.min(max,imgs.length), out=[];
    const c=document.createElement("canvas"); c.width=432; c.height=576;
    const g=c.getContext("2d");
    for(let i=0;i<n;i++){
      const a=imgs[n===1?0:Math.round(i*(imgs.length-1)/(n-1))];
      g.fillStyle="#000"; g.fillRect(0,0,432,576);
      const sw=iw(a.el), sh=ih(a.el), sc=Math.min(432/sw,576/sh);
      try{ g.drawImage(a.el,(432-sw*sc)/2,(576-sh*sc)/2,sw*sc,sh*sc) }catch(e){ continue }
      const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
      if(blob)out.push({blob,id:a.id,name:a.name});
    }
    return out;
  }
  const src=srcId&&assets.get(srcId);
  return (src&&src.shots)?src.shots.slice(0,max):[];
}

function applyAI(r){
  if(!r||typeof r!=="object")return false;
  const tpl=tplNow(); let got=0;
  AUTO.beats=AUTO.beats||{};
  tpl.beats.forEach(b=>{
    let v=r[b.id];
    if(typeof v==="string")v=[v];
    if(Array.isArray(v)){
      const ls=v.map(s=>String(s).trim()).filter(Boolean);
      if(ls.length){ AUTO.beats[b.id]=ls; got+=ls.length }
    }
  });
  /* khuôn cũ chỉ trả "lines" — vẫn nhận, rải vào các đoạn theo số câu mỗi đoạn */
  if(!got&&Array.isArray(r.lines)){
    const ls=r.lines.map(s=>String(s).trim()).filter(Boolean); let i=0;
    tpl.beats.forEach(b=>{ const take=ls.slice(i,i+b.n); i+=b.n; if(take.length){AUTO.beats[b.id]=take;got+=take.length} });
  }
  if(r.cardTitle)AUTO.cardT=String(r.cardTitle).slice(0,40);
  if(r.cardSub)AUTO.cardS=String(r.cardSub).slice(0,80);
  if(r.cardNote)AUTO.cardN=String(r.cardNote).slice(0,90);
  if(r.cta)AUTO.cardC=String(r.cta).slice(0,60);
  if(Array.isArray(r.hashtags))AUTO.tags=r.hashtags.map(s=>String(s)).slice(0,8);
  const hs=+r.hookShot;
  AUTO.hookId=(hs>=1&&AUTO._shotIds&&AUTO._shotIds[hs-1])?AUTO._shotIds[hs-1]:null;
  if(got)AUTO.script=allLines().join("\n");
  AUTO.approved=false;
  return got>0;
}

/* ===================== tự động edit ===================== */
/* ===================== khung kịch bản =====================
   Dựng từ 3 bài thật của chủ dự án. Công thức rút ra:
   móc → khoảnh khắc (có tên bác sĩ + cân nặng) → gia đình chờ ngoài cửa → chào mừng → nhả vía + cảm ơn.
   `share` là phần thời lượng của cả clip, cộng lại đúng 1. `hold` là số giây mỗi ảnh nên giữ. */
const TPL={
  do_de:{nm:"Ca đỡ đẻ thành công",
    tone:"ấm, mừng, như người trong nhà kể lại — dùng cách nói quen của mẹ Việt: vỡ òa, trộm vía, mẹ tròn con vuông, nhả vía, trắng trẻo, khóc to",
    beats:[

/* ===================== dán cả bài, tự chia về các nhịp =====================
   Bắt người ta điền 5 ô riêng là bắt họ nghĩ theo cấu trúc của app. Thực tế ai cũng
   viết sẵn một bài rồi mới đi tìm chỗ dán. Hai đường:
   - có nhãn nhịp đầu dòng ("Nhả vía:") thì theo nhãn — chuẩn nhất;
   - không có thì chia theo thứ tự, vì kịch bản clip bao giờ cũng viết đúng trình tự
     thời gian, nên thứ tự đoán đúng gần hết.
   Dùng String.fromCharCode chứ không viết \u trực tiếp: file này còn đi qua nhiều
   công cụ, escape dễ bị đổi thành ký tự thật rồi hỏng cả biểu thức. */
const DAU_RX=new RegExp("["+String.fromCharCode(0x300)+"-"+String.fromCharCode(0x36f)+"]","g");
const khongDau=s=>String(s||"").normalize("NFD").replace(DAU_RX,"").replace(/đ/g,"d").toLowerCase();
const gonChu=s=>khongDau(s).replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
/* mấy cách gọi quen mà không trùng tên nhịp trong TPL */
const NHAN_QUEN=[["hook","hook moc mo dau cau mo mo bai cau moc"],
  ["khoanhkhac","khoanh khac con ra chao doi sinh con luc sinh"],
  ["giadinh","gia dinh bo ong ba cho ngoai cua nguoi than"],
  ["chaomung","chao mung chao con loi chao"],
  ["nhavia","nha via cam on ket ket bai loi ket"],
  ["loikhuyen","loi khuyen nhan nhu"],["suonse","suon se ca sinh"],
  ["nghe","cong viec tham lang nghe"],["traocon","trao con"],["camon","cam on"]];

function beatTheoNhan(nhan,beats){
  const k=gonChu(nhan);
  if(k.length<3||k.length>28)return null;
  let b=beats.find(x=>khongDau(x.id)===k.replace(/ /g,""));
  if(b)return b;
  /* tên hiển thị kiểu "Móc (3 giây đầu)" hay "Nhả vía + cảm ơn" — bỏ ngoặc rồi so */
  b=beats.find(x=>{ const nm=gonChu(String(x.nm).replace(/\(.*?\)/g," "));
    return nm&&(nm===k||nm.startsWith(k)||k.startsWith(nm)) });
  if(b)return b;
  for(const [id,tu] of NHAN_QUEN){
    const bb=beats.find(x=>x.id===id);
    if(bb&&tu.indexOf(k)>=0)return bb;
  }
  return null;
}

/* một đoạn văn → từng câu, bỏ gạch đầu dòng và số thứ tự người ta hay gõ kèm */
function cauTuVanBan(text){
  return String(text||"").replace(/\r/g,"")
    .split(/\n+|(?<=[.!?…])\s+/)
    .map(s=>{ s=s.trim()
        .replace(/^[-*•–—+>]+\s*/,"")
        .replace(/^\d+\s*[.)\/]\s*/,"")
        .trim();
      /* chỉ bỏ ngoặc kép khi nó bao cả câu, đừng cắt mất dấu của câu có trích dẫn bên trong */
      if(/^["“'].*["”']$/.test(s))s=s.slice(1,-1).trim();
      return s })
    .filter(s=>s.length>1);
}

/* Neo: chỉ nhận mấy cụm gần như chắc chắn thuộc về một nhịp, đừng tham. Đoán sai một câu
   còn tệ hơn để nó rơi theo thứ tự, vì người dùng tưởng app hiểu nội dung rồi tin luôn. */
const NEO=[["nhavia",["nha via","cam on","tri an"]],
           ["camon",["cam on","tri an"]],
           ["chaomung",["chao con","chao mung"]],
           ["giadinh",["ong ba","ngoai cua","hanh lang"]],
           ["khoanhkhac",["da ke da","chao doi"]]];

/* giữ lại chữ đã dán qua mỗi lần vẽ lại giao diện — tách sai còn sửa rồi tách lại */
let bulkText="";

function tachKichBan(text){
  const beats=tplNow().beats, maxC=AUTO.subMax||36;
  const cau=cauTuVanBan(text);
  if(!cau.length)return null;
  const ra={}; beats.forEach(b=>ra[b.id]=[]);

  /* đường 1: theo nhãn */
  let cur=null, coNhan=false; const xep=[];
  cau.forEach(s=>{
    const m=s.match(/^([^:：]{2,28})[:：]\s*([\s\S]*)$/);
    const b=m&&beatTheoNhan(m[1],beats);
    /* không khớp nhịp nào thì đây là câu thường có dấu hai chấm — giữ nguyên cả câu */
    if(b){ coNhan=true; cur=b.id; if(m[2].trim())xep.push([b.id,m[2].trim()]); return }
    xep.push([cur,s]);
  });
  if(coNhan){
    xep.forEach(([id,s])=>chunkLine(s,maxC).forEach(x=>ra[id||beats[0].id].push(x)));
    return {beats:ra,kieu:"theo nhãn bạn ghi",soDong:Object.values(ra).reduce((n,a)=>n+a.length,0)};
  }

  /* đường 2: rải theo thứ tự.
     Chia theo CÂU rồi mới cắt mẩu, không được làm ngược. Cắt trước rồi chia thì các mẩu
     của cùng một câu văng vào những nhịp khác nhau: "Bác sĩ nói: con khỏe lắm," nằm ở
     nhịp móc còn "khóc to lắm, da hồng hào," nằm ở nhịp khoảnh khắc — đọc ra vô nghĩa. */
  const cauDa=cau.map(s=>({s,mau:chunkLine(s,maxC)}));
  const tongMau=cauDa.reduce((n,c)=>n+c.mau.length,0);
  const w=beats.map(b=>b.n||1), W=w.reduce((a,b)=>a+b,0);
  const quota=beats.map((b,i)=>Math.max(1,Math.round(tongMau*w[i]/W)));
  let bi=0, dung=0;
  const gan=cauDa.map(c=>{
    if(bi<beats.length-1&&dung>=quota[bi]){ bi++; dung=0 }
    dung+=c.mau.length;
    return bi;
  });
  /* Câu nào mang dấu hiệu gần như chắc chắn thì kéo thẳng về nhịp của nó, bất kể thứ tự
     rơi vào đâu — chia theo tỉ lệ hay lệch một nhịp khi người ta viết ít câu hơn mẫu cần. */
  cauDa.forEach((c,i)=>{ const k=gonChu(c.s);
    for(const [id,tu] of NEO){
      const j=beats.findIndex(b=>b.id===id);
      if(j>=0&&tu.some(t=>k.indexOf(t)>=0)){ gan[i]=j; break }
    } });
  cauDa.forEach((c,i)=>c.mau.forEach(x=>ra[beats[gan[i]].id].push(x)));
  return {beats:ra,kieu:"theo thứ tự",soDong:tongMau};
}

function goiMoc(){
  const bank=MOC[AUTO.tpl]||MOC.do_de, maxC=Math.max(28,Math.min(40,AUTO.subMax||36));
  const dang=beatLines("hook")[0]||"", ra=[];
  const bs=String(AUTO.bs||"").trim();
  if(bs){
    const ten=(MOC_TEN[AUTO.tpl]||MOC_TEN.do_de)(bs).filter(s=>s.length<=maxC&&s!==dang);
    if(ten.length)ra.push(["có tên bác sĩ",ten[Math.floor(Math.random()*ten.length)]]);
  }
  const kieu=bank.slice();
  for(let i=kieu.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=kieu[i];kieu[i]=kieu[j];kieu[j]=t}
  for(const k of kieu){
    if(ra.length>=3)break;
    const con=k[1].filter(s=>s!==dang&&s.length<=maxC&&!ra.some(r=>r[1]===s));
    if(con.length)ra.push([k[0],con[Math.floor(Math.random()*con.length)]]);
  }
  return ra;
}

    }

}

/* rải phụ đề bám theo chỗ có tiếng nói trong voice */
function autoSubs(lines){
  P.clips.sub=[];
  const vc=P.clips.voice[0], a=vc&&assets.get(vc.assetId);
  const segs=a&&a.speech&&a.speech.length?a.speech:null;
  if(!segs||!lines.length)return false;
  const chars=lines.reduce((n,l)=>n+l.length,0)||1;
  const span=segs.reduce((n,s)=>n+(s.end-s.start),0)||1;
  let li=0;
  segs.forEach((s,i)=>{
    const last=i===segs.length-1;
    let budget=(s.end-s.start)/span*chars, chunk=[];
    while(li<lines.length){
      const L=lines[li].length;
      if(chunk.length&&!last&&L>budget)break;   /* câu sau không vừa thì để dành cho đoạn kế */
      chunk.push(lines[li]); budget-=L; li++;
      if(!last&&budget<=0)break;
    }
    if(!chunk.length)return;
    const per=(s.end-s.start)/chunk.length;
    chunk.forEach((ln,j)=>pushSub(ln,vc.start+s.start+j*per,per));
  });
  return P.clips.sub.length>0;
}

/* Câu ở mẫu này dài 12–24 chữ. Để cả câu đứng một chỗ 6–7 giây thì không ai đọc kiểu đó,
   nên cắt câu ở dấu ngắt (phẩy, gạch ngang, ba chấm) thành từng mẩu ngắn hiện lần lượt. */
function chunkLine(s,maxC){
  s=String(s||"").trim();
  if(!s)return [];
  if(s.length<=maxC)return [s];
  const parts=[]; let buf="";
  for(const ch of s){ buf+=ch; if("‚,;:—–…".indexOf(ch)>=0){ if(buf.trim())parts.push(buf.trim()); buf="" } }
  if(buf.trim())parts.push(buf.trim());
  const join=[]; let cur="";
  for(const p of parts){
    if(!cur){ cur=p; continue }
    if((cur+" "+p).length<=maxC)cur+=" "+p; else { join.push(cur); cur=p }
  }
  if(cur)join.push(cur);
  const out=[];
  for(const o of join){
    if(o.length<=maxC){ out.push(o); continue }
    let c=""; for(const w of o.split(/\s+/)){ if(c&&(c+" "+w).length>maxC){ out.push(c); c=w } else c=c?c+" "+w:w }
    if(c)out.push(c);
  }
  /* đừng để rơi mẩu cụt kiểu "lòng." hay một cái emoji đứng một mình — dồn ngược vào mẩu trước */
  for(let i=out.length-1;i>0;i--){
    if([...out[i]].length<10){ out[i-1]=out[i-1]+" "+out[i]; out.splice(i,1) }
  }
  return out.length?out:[s];
}
/* rải một câu (đã cắt mẩu) vào khoảng [t0, t0+d], chia theo độ dài từng mẩu */
function pushSub(line,t0,d){
  const cs=chunkLine(line,AUTO.subMax||36);
  if(!cs.length)return;
  const tot=cs.reduce((n,c)=>n+c.length,0)||1;
  let t=t0;
  cs.forEach(c=>{
    const cd=Math.max(.9,d*c.length/tot);
    /* một dòng ngắn mà đứng 6 giây thì đọc xong còn ngồi nhìn chữ.
       Giữ tối đa 4 giây rồi tắt, phần dư để hình thở. */
    const show=Math.min(cd-.1,4);
    P.clips.sub.push({id:uid(),text:c,start:+(t+Math.min(.15,(cd-show)/2)).toFixed(2),
      dur:+Math.max(.9,show).toFixed(2)});
    t+=cd;
  });
}
/* chưa có voice: chia câu trong từng đoạn theo tỉ lệ số ký tự, trong đúng khoảng thời gian của đoạn đó */
function subsFromBeats(span,skip){
  P.clips.sub=[];
  tplNow().beats.forEach(b=>{
    if(skip&&b.id===skip)return;
    const ls=beatLines(b.id), s=span[b.id];
    if(!ls.length||!s)return;
    const tot=ls.reduce((n,l)=>n+l.length,0)||1;
    const avail=Math.max(1.3,(s.b-s.a)-.5);
    let t0=s.a+.22;
    ls.forEach(l=>{ const d=Math.max(1.4,avail*l.length/tot); pushSub(l,t0,d); t0+=d });
  });
  return P.clips.sub.length>0;
}

/* ===================== dựng theo khung kịch bản (bộ ảnh → clip cảm động) ===================== */
/* Thả cả thư mục vào rồi bấm dựng ngay thì video có thể chưa đọc xong metadata (a.d vẫn là 0),
   lúc đó clip thật bị loại khỏi bản dựng mà không báo gì. Gặp đúng lỗi này khi chạy thử, nên chờ một nhịp. */
async function waitVideos(ms){
  const pend=()=>[...assets.values()].filter(a=>a.kind==="video"&&!(a.d>0)).length;
  const t0=Date.now();
  while(pend()&&Date.now()-t0<(ms||6000))await new Promise(r=>setTimeout(r,150));
  return pend();
}
async function runTemplate(){
  const tpl=tplNow();
  await waitVideos(6000);
  if(AUTO.dedup)dedupe();
  const imgs=liveImgs();
  /* outro là đoạn kết, không phải một cảnh trong bộ — phải loại ra khỏi danh sách cảnh thường */
  const outro=AUTO.outroId?assets.get(AUTO.outroId):null;
  const outroOk=!!(outro&&outro.kind==="video"&&outro.d>0);
  const vids=[...assets.values()].filter(a=>a.kind==="video"&&a.d>0&&a.id!==AUTO.outroId).sort(nameSort);
  if(!imgs.length&&!vids.length){ toast("Chưa có ảnh nào — thả thư mục ảnh vào ở bước 1"); return }
  const voice=[...assets.values()].find(a=>a.kind==="audio"&&a.buffer&&a.role!=="music"&&a.speech&&a.speech.length);
  const target=voice?Math.max(16,voice.d+1.6):Math.max(16,AUTO.total);

  snapshot();
  P.clips.text=[];P.clips.video=[];P.clips.fx=[];P.clips.sub=[];P.clips.music=[];
  P.look=AUTO.look?{warm:.22,glow:.10,vig:.30}:{warm:0,glow:0,vig:0};
  /* Mặt người trong bộ ảnh này nằm khoảng giữa khung, nên đẩy phụ đề xuống 84% — vừa tránh mặt,
     vừa rơi vào dải mờ dưới nên đọc rõ. Chữ hồng theo ý chủ dự án. */
  P.sub.on=true; P.sub.size=62; P.sub.pos=84; P.sub.color=AUTO.subColor;

  /* Mỗi đoạn kịch bản lấy phần thời lượng của nó rồi cắt thành từng cảnh.
     Nhịp lấy từ AUTO.hold, nhưng không bao giờ cắt nhỏ hơn số ảnh đang có —
     ít ảnh mà nhiều cảnh thì chỉ là dùng lại một tấm, nhìn còn tệ hơn. */
  const nMax=Math.max(5,imgs.length+vids.length);
  const PACE=Math.max(1.6,Math.min(4.5,AUTO.hold||2.5),target/nMax);
  const plan=[];
  tpl.beats.forEach(b=>{
    const bd=target*b.share;
    let n=Math.max(1,Math.round(bd/PACE));
    while(bd/n>PACE*1.45)n++;   /* không để tấm nào nằm lâu hơn hẳn các tấm khác */
    for(let i=0;i<n;i++)plan.push({beat:b.id,dur:bd/n});
  });
  /* Mở clip nhanh rồi giãn dần: 20 giây đầu là chỗ người xem quyết định ở hay đi,
     phải thấy ảnh đổi liên tục; về cuối cho ảnh nằm lâu hơn để lắng lại. */
  if(plan.length>2){
    const w=i=>.76+.4*(i/(plan.length-1));
    const tot=plan.reduce((s,p)=>s+p.dur,0), ws=plan.reduce((s,_,i)=>s+w(i),0);
    plan.forEach((p,i)=>{ p.dur=tot/ws*w(i) });
  }

  /* ảnh mở đầu dùng ảnh Claude thấy mạnh nhất, còn lại lấy đều khắp bộ để chuyện đi tới */
  const pool=imgs.slice();
  if(AUTO.hookId){ const i=pool.findIndex(a=>a.id===AUTO.hookId); if(i>0)pool.unshift(pool.splice(i,1)[0]) }
  /* Lấy đều khắp bộ, nhưng nếu tấm vừa rơi vào lại gần giống tấm trước thì dò quanh đó tìm tấm khác hẳn.
     Vẫn đi theo thứ tự tên file nên mạch thời gian của ca sinh không bị đảo. */
  /* .14 là ngưỡng đo được trên bộ ảnh thật: dưới mức này còn lọt cặp ảnh nhìn y nhau,
     trên mức này thì phải nhảy quá xa, cuối cùng lại quay về dùng ảnh đã dùng rồi. */
  const MINDIF=.14, used=new Set();
  let prevSig=null;
  plan.forEach((s,i)=>{
    if(!pool.length){ s.asset=null; return }
    const base=i===0?0:Math.min(pool.length-1,Math.round(i*(pool.length-1)/Math.max(1,plan.length-1)));
    const free=j=>j>=0&&j<pool.length&&!used.has(j);
    const diff=j=>!prevSig||!pool[j].sig||sigDist(pool[j].sig,prevSig)>=MINDIF;
    let pick=-1;
    if(free(base)&&diff(base))pick=base;
    for(let r=1;r<=8&&pick<0;r++){ if(free(base+r)&&diff(base+r))pick=base+r; else if(free(base-r)&&diff(base-r))pick=base-r }
    for(let r=0;r<pool.length&&pick<0;r++){ if(free(base+r))pick=base+r; else if(free(base-r))pick=base-r }
    if(pick<0)pick=base;   /* ảnh ít hơn số cảnh thì đành dùng lại */
    used.add(pick); s.asset=pool[pick]; prevSig=pool[pick].sig||prevSig;
  });
  /* clip thật chen vào khúc giữa — đó là chỗ người xem dễ rời nhất */
  if(vids.length&&plan.length>3){
    const bid=tpl.beats[Math.min(2,tpl.beats.length-1)].id;
    const slots=plan.map((s,i)=>s.beat===bid?i:-1).filter(i=>i>=0);
    /* hai clip thật nằm cạnh nhau thì lúc mờ chồng phải phát hai thẻ <video> cùng lúc — tránh ra */
    const nv=Math.min(vids.length,2,Math.ceil(slots.length/2));
    for(let j=0;j<nv;j++){
      const k=nv===1?Math.floor(slots.length/2):Math.round(j*(slots.length-1)/(nv-1));
      plan[slots[k]].asset=vids[j];
    }
  }

  let t=0, prev=null, kbi=0;
  plan.forEach((s,i)=>{
    const a=s.asset, isV=a&&a.kind==="video";
    /* mờ chồng chỉ dùng được khi hai cảnh là hai file khác nhau — một thẻ <video> không phát hai chỗ cùng lúc */
    const canXf=i>0&&AUTO.xf>0&&(!a||!prev||a.id!==prev.id);
    /* cảnh ngắn thì mờ chồng cũng phải ngắn, không thì cả cảnh là một vệt mờ, nhìn vẫn như đứng hình */
    const xf=canXf?+Math.min(AUTO.xf,s.dur*.28,plan[i-1].dur*.28).toFixed(2):0;
    const start=i===0?0:+(t-xf).toFixed(2);
    const c={id:uid(),assetId:a?a.id:null,start,dur:+s.dur.toFixed(2),in:0,
      effect:isV?"none":KB[kbi++%KB.length],speed:1,vol:0,
      fit:AUTO.fit,xf,beat:s.beat,bg:i%CARD_BG.length};
    if(isV)c.in=+clamp(a.d*.1,0,Math.max(0,a.d-s.dur)).toFixed(2);
    P.clips.video.push(c);
    t=start+c.dur; prev=a;
  });

  const span={};
  P.clips.video.forEach(c=>{ if(!c.beat)return;
    const s=span[c.beat]||(span[c.beat]={a:1e9,b:0});
    s.a=Math.min(s.a,c.start); s.b=Math.max(s.b,c.start+c.dur) });

  /* câu móc hiện chữ to giữa khung trong 3 giây đầu */
  const hk=beatLines(tpl.beats[0].id);
  let hookEnd=0;
  if(hk.length){
    const s=span[tpl.beats[0].id]||{a:0,b:3.2};
    hookEnd=s.b;
    /* pos 16 = dải mờ phía trên, trên đầu người trong ảnh — để giữa khung là che mặt */
    /* Sàn 2.6s chứ không phải 1.8s: clip 28 giây thì phần chia theo tỉ lệ cho móc chỉ còn
       chưa tới 2 giây, đọc không kịp một câu 36 ký tự — mà móc đọc không kịp thì hỏng cả clip.
       Chữ móc có tràn sang nhịp sau vài phần mười giây cũng không sao: nó nằm sát mép trên,
       phụ đề nằm dưới đáy, hai chỗ khác hẳn nhau. hookEnd vẫn giữ theo ảnh để phụ đề
       không bị cắt mất dòng. */
    P.clips.text.push({id:uid(),style:"pop",text:hk.join(" "),
      start:+(s.a+.25).toFixed(2),dur:+Math.max(2.6,(s.b-s.a)-.35).toFixed(2),
      size:62,pos:16,color:AUTO.subColor,box:""});
  }

  if(voice){
    P.clips.voice=[{id:uid(),assetId:voice.id,start:.3,dur:+voice.d.toFixed(2),in:0,vol:1}];
    if(!autoSubs(allLines()))subsFromBeats(span,tpl.beats[0].id);
    /* chữ to và phụ đề không được hiện cùng một câu */
    P.clips.sub=P.clips.sub.filter(c=>c.start>=hookEnd-.25);
  }else{
    P.clips.voice=[];
    subsFromBeats(span,tpl.beats[0].id);
  }

  /* Có outro riêng thì thôi thẻ cuối tự vẽ — hai cái kết liền nhau nhìn thừa. */
  const useCard=AUTO.card&&!outroOk;
  let cardStart=0;
  if(useCard){
    const d=5.2, xf=+Math.min(AUTO.xf,1).toFixed(2);
    cardStart=+(t-xf).toFixed(2);
    /* để ảnh cuối làm nền thẻ thay vì một mảng nâu trơn — kết clip đỡ cụt */
    const lastA=P.clips.video.length?P.clips.video[P.clips.video.length-1].assetId:null;
    P.clips.video.push({id:uid(),assetId:lastA,start:cardStart,dur:d,in:0,effect:"kbin",
      speed:1,vol:0,fit:AUTO.fit,xf,bg:0});
    P.clips.text.push({id:uid(),style:"card",text:AUTO.cardT,sub:AUTO.cardS,note:AUTO.cardN,cta:AUTO.cardC,
      start:cardStart,dur:d,color:"#9e2b20",color2:"#b8441f",ctabg:"#9e2b20",bgc:"#f7e9cc",logo:true});
    t=cardStart+d;
  }

  /* Outro dán nguyên si: chạy hết chiều dài của nó, không hiệu ứng, giữ nguyên tiếng,
     `raw` để khỏi phủ màu ấm lên nhận diện thương hiệu. Mờ chồng rất ngắn cho đỡ cụt. */
  let outroStart=t;
  if(outroOk){
    const xf=+Math.min(AUTO.xf,.3,outro.d*.2).toFixed(2);
    outroStart=+Math.max(0,t-xf).toFixed(2);
    P.clips.video.push({id:uid(),assetId:outro.id,start:outroStart,dur:+outro.d.toFixed(2),in:0,
      effect:"none",speed:1,vol:1,fit:"cover",xf,bg:0,raw:true});
    t=outroStart+outro.d;
  }

  /* tiếng chuyển cảnh kiểu "vút" sai hẳn mood — chỉ còn lấp lánh rất nhẹ ở hai chỗ */
  if(AUTO.fx){
    P.clips.fx.push({id:uid(),libId:"lap_lanh",label:"Lấp lánh",start:.2,dur:1.6,vol:.22});
    if(useCard)P.clips.fx.push({id:uid(),libId:"lap_lanh",label:"Lấp lánh",start:+(cardStart+.15).toFixed(2),dur:1.6,vol:.18});
  }
  if(AUTO.music!=="none"){
    const own=String(AUTO.music||"").startsWith("asset:")?assets.get(AUTO.music.slice(6)):null;
    const useOwn=!!(own&&own.buffer);
    const m=useOwn?null:(LIB_MUSIC.find(x=>x.id===AUTO.music)||LIB_MUSIC[0]);
    const srcOf=()=>useOwn?{assetId:own.id,label:own.name}:{libId:m.id,label:"lib:nhac/"+m.nm};
    /* Không có giọng đọc thì nhạc là toàn bộ phần tiếng, phải to hơn: đo bản xuất ở 0.34
       ra -27.8 dBFS, nhỏ so với mặt bằng clip mạng xã hội. 0.45 đưa về khoảng -25. */
    const v0=voice?.16:.45;
    const mainEnd=outroOk?outroStart:t;
    P.clips.music=[Object.assign({id:uid(),start:0,dur:+mainEnd.toFixed(2),in:0,vol:v0},srcOf())];
    /* Đo trên outro thật: nó chỉ có một tiếng nhấn ~2 giây rồi im hẳn. Tắt nhạc ngay chỗ outro vào
       là ba giây cuối chết tiếng. Cho nhạc chạy tiếp nhưng nhỏ còn một nửa, nối đúng chỗ đang dở
       của bài (`in`) chứ không phát lại từ đầu. */
    if(outroOk)P.clips.music.push(Object.assign({id:uid(),start:+outroStart.toFixed(2),
      dur:+outro.d.toFixed(2),in:+outroStart.toFixed(2),vol:+(v0*.5).toFixed(3)},srcOf()));
    if(m)lib(m.id);
  }
  AUTO.approved=true;
  sel=null; seek(0); allUI(); step(3);
  toast("Xong! "+P.clips.video.length+" cảnh · "+fmt(dur())+(voice?" · khớp theo voice":" · chưa có voice")+
    (outroOk?" · có outro":""));
}

async function runAuto(){
  const lines=AUTO.script.split("\n").map(s=>s.trim()).filter(Boolean);
  const vis=[...assets.values()].filter(a=>a.kind==="video"||a.kind==="image");
  const src=srcId?assets.get(srcId):null;
  const scn=src&&src.scenes&&src.scenes.length>1?src.scenes:null;
  const voice=[...assets.values()].find(a=>a.kind==="audio"&&a.buffer&&a.role!=="music");
  const need=voice?voice.d:0;
  const nBase=scn?scn.length:Math.max(lines.length*2,vis.length,4);
  snapshot();
  P.clips.text=[];P.clips.video=[];P.clips.fx=[];P.clips.sub=[];P.clips.music=[];
  const jit=AUTO.pace==="nhanh"?.25:AUTO.pace==="cham"?.55:.35;
  const cap=AUTO.pace==="nhanh"?AUTO.scene*1.4:AUTO.scene*1.9;
  const fxList=["zoomin","zoomout","panr","zoomin","panl","shake"];
  let t=0;
  for(let i=0;i<400;i++){
    if(need){ if(t>=need-.08)break } else if(i>=nBase)break;
    let clip;
    if(scn){
      const s=scn[i%nBase], raw=s.end-s.start;
      let d=+clamp(raw,1,Math.max(1.3,cap)).toFixed(1);
      clip={id:uid(),assetId:src.id,start:+t.toFixed(2),dur:d,in:+s.start.toFixed(2),
            effect:fxList[i%fxList.length],speed:1,vol:0,bg:i%CARD_BG.length};
    }else{
      const d=+Math.max(1,AUTO.scene+(i%3-1)*jit*.6).toFixed(1);
      const a=vis.length?vis[i%vis.length]:null;
      clip={id:uid(),assetId:a?a.id:null,start:+t.toFixed(2),dur:d,in:0,effect:fxList[i%fxList.length],
            speed:(AUTO.pace==="nhanh"&&i%4===3)?1.5:1,vol:0,bg:i%CARD_BG.length};
      if(a&&a.kind==="video"&&a.d>d){const slots=Math.max(1,Math.floor(a.d/d));clip.in=+((i%slots)*d).toFixed(2)}
    }
    if(need&&t+clip.dur>need){
      const left=+(need-t).toFixed(2);
      if(left<1.2){ const last=P.clips.video[P.clips.video.length-1]; if(last){last.dur=+(last.dur+left).toFixed(2);t=need} break }
      clip.dur=left;
    }
    P.clips.video.push(clip);
    if(AUTO.fx&&i>0)P.clips.fx.push({id:uid(),libId:"chuyen_canh",label:"Chuyển cảnh",start:+(t-.12).toFixed(2),dur:.55,vol:.5});
    t+=clip.dur;
  }
  if(!P.clips.video.length)P.clips.video.push({id:uid(),assetId:null,start:0,dur:3,in:0,effect:"zoomin",speed:1,vol:0,bg:0}),t=3;
  const nSc=P.clips.video.length;
  const per=Math.max(1,Math.floor(nSc/Math.max(1,lines.length)));
  /* bật phụ đề thì chữ to chỉ còn câu móc ở đầu, khỏi trùng với phụ đề bên dưới */
  const bigLines=AUTO.subs?lines.slice(0,1):lines;
  let si=0;
  bigLines.forEach((ln,i)=>{
    const span=AUTO.subs?Math.min(P.clips.video.length,2):per;
    const sc=P.clips.video.slice(si,si+span); si+=span;
    if(!sc.length)return;
    const s=sc[0].start, e=sc[sc.length-1].start+sc[sc.length-1].dur;
    P.clips.text.push({id:uid(),style:"pop",text:ln,start:+(s+.1).toFixed(2),dur:+(e-s-.2).toFixed(2),size:92,pos:i%2?26:34,color:"#ffffff",box:""});
  });
  if(voice&&!P.clips.voice.length)P.clips.voice.push({id:uid(),assetId:voice.id,start:0,dur:+voice.d.toFixed(2),in:0,vol:1});
  if(AUTO.subs&&!autoSubs(lines)){
    let sj=0;
    lines.forEach(ln=>{
      const sc=P.clips.video.slice(sj,sj+per); sj+=per;
      if(!sc.length)return;
      const s=sc[0].start, e=sc[sc.length-1].start+sc[sc.length-1].dur;
      P.clips.sub.push({id:uid(),text:ln,start:+(s+.1).toFixed(2),dur:+(e-s-.2).toFixed(2)});
    });
  }
  if(AUTO.card){
    const d=5.4;
    P.clips.video.push({id:uid(),assetId:null,start:+t.toFixed(2),dur:d,in:0,effect:"zoomin",speed:1,vol:0,bg:0});
    P.clips.text.push({id:uid(),style:"card",text:AUTO.cardT,sub:AUTO.cardS,note:AUTO.cardN,cta:AUTO.cardC,
      start:+t.toFixed(2),dur:d,color:"#9e2b20",color2:"#b8441f",ctabg:"#9e2b20",bgc:"#f7e9cc",logo:true});
    if(AUTO.fx){ P.clips.fx.push({id:uid(),libId:"dang_len",label:"Dâng lên (dẫn vào)",start:+(t-1.2).toFixed(2),dur:1.3,vol:.6});
                 P.clips.fx.push({id:uid(),libId:"dinh",label:"Đinh (nhấn mạnh)",start:+(t+.05).toFixed(2),dur:1.1,vol:.7}) }
    t+=d;
  }
  if(AUTO.music!=="none"){
    const own=String(AUTO.music||"").startsWith("asset:")?assets.get(AUTO.music.slice(6)):null;
    if(own&&own.buffer)P.clips.music=[{id:uid(),assetId:own.id,label:own.name,start:0,dur:+t.toFixed(2),in:0,vol:voice?.18:.3}];
    else{ const m=LIB_MUSIC.find(x=>x.id===AUTO.music)||LIB_MUSIC[0];
      P.clips.music=[{id:uid(),libId:m.id,label:"lib:nhac/"+m.nm,start:0,dur:+t.toFixed(2),in:0,vol:voice?.18:.3}];lib(m.id) }}
  sel=null;seek(0);allUI();step(3);toast("Xong! "+P.clips.video.length+" cảnh");
}

async function saveFile(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||"text/plain;charset=utf-8"});
  if(dlCap){ try{ await dlCap.save({filename:name,data:blob}); toast("Đã lưu "+name); return true }
    catch(err){ if(err&&err.code==="declined")return false;
      if(err&&(err.code==="rejected_extension"||err.code==="too_large")){toast("Không lưu được: "+name);return false} } }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast("Đã tải "+name); return true;
}
const srtT=t=>{const h=Math.floor(t/3600),m=Math.floor(t/60)%60,s=Math.floor(t%60),ms=Math.round((t-Math.floor(t))*1000);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+","+String(ms).padStart(3,"0")};
function subRows(){
  let rows=P.clips.sub.slice();
  if(!rows.length)rows=P.clips.text.filter(c=>c.style!=="card").map(c=>({text:c.text,start:c.start,dur:c.dur}));
  return rows.sort((a,b)=>a.start-b.start).filter(c=>String(c.text||"").trim());
}
function buildSrt(){
  return subRows().map((c,i)=>(i+1)+"\r\n"+srtT(c.start)+" --> "+srtT(c.start+c.dur)+"\r\n"+String(c.text).trim()+"\r\n").join("\r\n");

let mediaRec=null, micChunks=[];
async function micToggle(){
  if(mediaRec&&mediaRec.state==="recording"){ mediaRec.stop(); return }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Trình duyệt không cho thu âm");return}
  let st; try{ st=await navigator.mediaDevices.getUserMedia({audio:true}) }catch(e){ toast("Chưa cho phép dùng micro"); return }
  micChunks=[]; mediaRec=new MediaRecorder(st);
  mediaRec.ondataavailable=e=>{if(e.data.size)micChunks.push(e.data)};
  mediaRec.onstop=async()=>{
    st.getTracks().forEach(t=>t.stop());
    const blob=new Blob(micChunks,{type:mediaRec.mimeType||"audio/webm"});
    mediaRec=null;
    const a=await addVoiceBlob(blob,"thu_am_"+new Date().toTimeString().slice(0,5).replace(":","")+".webm");
    if(a&&AUTO.approved)await build();   /* đã dựng rồi thì khớp lại luôn theo giọng vừa thu */
  };
  mediaRec.start(); ui_left(); toast("Đang thu… bấm lần nữa để dừng");
}
function viVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  return vs.find(v=>/^vi/i.test(v.lang))||vs.find(v=>/viet/i.test(v.name))||null;
}
function speakScript(){
  if(!window.speechSynthesis){toast("Trình duyệt không có giọng đọc");return}
  speechSynthesis.cancel();
  const v=viVoice();
  if(!v){toast("Trình duyệt này không có giọng tiếng Việt — xem 3 cách ở khung Giọng đọc");return}
  const u=new SpeechSynthesisUtterance(allLines().join(" "));
  u.voice=v; u.lang=v.lang; u.rate=.95;
  speechSynthesis.speak(u);
  toast("Đọc thử thôi — giọng này KHÔNG vào được video xuất ra");
}

/* ===================== giọng đọc =====================
   Đã thử thật trong lúc làm: không có API đọc tiếng Việt nào vừa miễn phí vừa không cần key
   mà gọi được từ trình duyệt (Google Translate chặn CORS, StreamElements giờ đòi đăng nhập).
   Nên để 3 đường, không đường nào phải cài gì lên máy:
     1. thu giọng thật bằng mic — với nội dung này thường hay hơn giọng máy
     2. key ElevenLabs của chủ dự án — đã kiểm CORS mở, gọi thẳng được, một nút ra voice, chạy ở máy nào cũng được
     3. copy kịch bản sang web đọc miễn phí rồi thả mp3 về
   Cả 3 đường đổ về addVoiceBlob(), xong là tự dò đoạn nói và khớp phụ đề. */
const TTSK="aes-11key";
const ttsKey=()=>{ try{ return localStorage.getItem(TTSK)||"" }catch(e){ return "" } };
function ttsSetKey(k){ try{ k?localStorage.setItem(TTSK,k):localStorage.removeItem(TTSK) }catch(e){} }
let ttsVoices=null;

async function addVoiceBlob(blob,name){
  const id=uid(), url=URL.createObjectURL(blob);
  const a={id,kind:"audio",name,url,d:0,buffer:null,speech:[],role:"voice"};
  try{
    const buf=await audio().decodeAudioData(await blob.arrayBuffer());
    a.buffer=buf; a.d=buf.duration; a.speech=speechOf(buf);
    assets.set(id,a);
    toast("Voice "+fmt(a.d)+" · dò được "+a.speech.length+" đoạn nói");
  }catch(e){ toast("Không đọc được file voice này"); return null }
  ui_left(); ui_status();
  return a;
}
/* Một file mp3 có thể là giọng đọc hoặc là bài hát nền — app không tự đoán chắc được,
   nên để người dùng bấm. Đổi vai thì dò lại đoạn nói và dựng lại luôn. */
async function setAudioRole(id,role){
  const a=assets.get(id); if(!a||a.kind!=="audio")return;
  if(a.role===role)return;
  a.role=role;
  if(role==="music"){
    a.speech=[];
    AUTO.music="asset:"+a.id;
  }else{
    try{ a.speech=a.buffer?speechOf(a.buffer):[] }catch(e){ a.speech=[] }
    if(AUTO.music==="asset:"+a.id)AUTO.music=LIB_MUSIC[0]?LIB_MUSIC[0].id:"none";
    if(a.speech.length)AUTO.subs=true;
  }
  toast(a.name+" → "+(role==="music"?"nhạc nền":"giọng đọc"+(a.speech.length?" · "+a.speech.length+" đoạn nói":"")));
  ui_left(); ui_status();
  if(AUTO.approved)await build();
}

async function ttsLoadVoices(){
  const k=ttsKey(); if(!k){ toast("Dán key ElevenLabs trước đã"); return }
  busy="Đang lấy danh sách giọng…"; ui_left();
  try{
    const r=await fetch("https://api.elevenlabs.io/v1/voices",{headers:{"xi-api-key":k}});
    if(!r.ok){ toast(r.status===401?"Key không đúng":"Không lấy được danh sách giọng ("+r.status+")"); return }
    const j=await r.json();
    ttsVoices=(j.voices||[]).map(v=>({id:v.voice_id,
      nm:v.name+(v.labels&&v.labels.gender?" · "+v.labels.gender:"")}));
    if(ttsVoices.length&&!ttsVoices.some(v=>v.id===AUTO.ttsVoice))AUTO.ttsVoice=ttsVoices[0].id;
    toast("Có "+ttsVoices.length+" giọng — chọn giọng nữ nhẹ rồi bấm Tạo");
  }catch(e){ toast("Không gọi được ElevenLabs") }
  finally{ busy=""; ui_left() }
}
async function ttsRun(){
  const k=ttsKey(), txt=allLines().join("\n");
  if(!k){ toast("Dán key ElevenLabs trước đã"); return }
  if(!txt){ toast("Chưa có kịch bản"); return }
  if(!ttsVoices){ await ttsLoadVoices(); if(!ttsVoices||!ttsVoices.length)return }
  busy="Đang tạo giọng đọc…"; ui_left();
  try{
    const r=await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+
      encodeURIComponent(AUTO.ttsVoice)+"?output_format=mp3_44100_128",{
      method:"POST",
      headers:{"xi-api-key":k,"content-type":"application/json"},
      body:JSON.stringify({text:txt,model_id:"eleven_multilingual_v2",
        voice_settings:{stability:.52,similarity_boost:.75,style:.15,use_speaker_boost:true}})
    });
    if(!r.ok){
      const body=await r.text().catch(()=>"");
      console.warn("elevenlabs",r.status,body.slice(0,300));
      toast(r.status===401?"Key không đúng":r.status===429?"Hết hạn mức tháng này":
            r.status===422?"ElevenLabs không nhận nội dung này":"ElevenLabs lỗi "+r.status);
      return;
    }
    const a=await addVoiceBlob(await r.blob(),"voice_ai.mp3");

  }catch(e){ toast("Không gọi được ElevenLabs (mạng hoặc key)") }
  finally{ busy=""; ui_left() }
}
function pickMime(){

async function doExport(){
  const total=dur(); if(total<=0){toast("Chưa có gì để xuất");return}
  if(!window.MediaRecorder){toast("Trình duyệt không hỗ trợ xuất. Dùng Chrome nhé.");return}
  audio(); await ac.resume();
  /* chờ font xong rồi hãy ghi — font về giữa chừng thì chữ đổi mặt ngay trong clip */
  try{ if(document.fonts&&document.fonts.ready)await document.fonts.ready }catch(e){}
  const mime=pickMime(); const box=$("#expOut"); const bar=$("#expBar>i");
  $("#btnGo").disabled=true;
  /* Nhạc tự sinh mất vài giây để dựng. Phải dựng xong TRƯỚC khi bấm ghi — không thì
     scheduleAudio() ngồi chờ trong lúc máy đã ghi rồi, và mấy giây đầu file xuất ra
     là một khung hình đứng im. */
  if(EXP.audio!=="silent"){
    box.innerHTML='<p class="hint">Đang chuẩn bị nhạc…</p>';
    for(const k of ["music","fx"]) for(const c of P.clips[k]) if(c.libId){ try{ await lib(c.libId) }catch(e){} }
  }
  box.innerHTML='<p class="hint">Đang xuất… giữ nguyên tab này, đừng chuyển cửa sổ.</p>';
  const stream=cv.captureStream(EXP.fps);
  const dest=ac.createMediaStreamDestination(); master.connect(dest);
  for(const a of assets.values()) if(a.kind==="video"&&a.el) mediaGain(a);
  dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:EXP.mbps*1e6}:undefined);
  const chunks=[]; rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);
  const timer=setInterval(()=>{bar.style.width=Math.round(time/total*100)+"%"},100);
  seek(0); rec.start(300);
  onEnd=()=>{setTimeout(()=>{try{rec.stop()}catch(e){}},350)};
  exporting=true; await play(); await done;
  exporting=false; clearInterval(timer); bar.style.width="100%";
  try{master.disconnect(dest)}catch(e){}
  const type=mime||"video/webm";
  const blob=new Blob(chunks,{type});
  const ext=type.includes("mp4")?"mp4":"webm";
  const url=URL.createObjectURL(blob);
  const name=safeName(P.name)+"."+ext;
  box.innerHTML='<video class="result" controls src="'+url+'"></video>'+
    '<button class="btn primary" id="dl" style="justify-content:center">⬇ Lưu '+name+'</button>'+
    '<button class="btn" id="dlSrt2" style="justify-content:center">⬇ Lưu phụ đề .srt</button>'+
    '<p class="hint">'+(Math.round(blob.size/1048576*10)/10)+' MB · '+fmt(total)+' · '+EXP.w+'×'+Math.round(EXP.w*16/9)+
    '. Nút lưu không chạy? Bấm chuột phải vào video → <b>Lưu video thành…</b></p>';
  $("#dl").onclick=()=>saveFile(name,blob);
  $("#dlSrt2").onclick=()=>saveFile(safeName(P.name)+".srt",buildSrt(),"text/plain;charset=utf-8");
  $("#btnGo").disabled=false; toast("Xuất xong!");
}
